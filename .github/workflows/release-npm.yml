name: Publish to npm

# Builds and publishes the JS libraries @pyxis-llm/client, @pyxis-llm/core and
# @pyxis-llm/react publicly to npm (registry.npmjs.org, scope @pyxis-llm),
# using the NPM_TOKEN repository secret. The llmd binary is not built or
# published here (go-ci.yml builds it for testing).
#
# Trigger: pushing a v* tag (the tag, e.g. v1.2.3, becomes the published npm
# version, leading "v" stripped), or a manual run with a version input (or on
# a tag). Creating a GitHub Release also pushes its tag, so that publishes too,
# exactly once. scripts/set-npm-versions.mjs keeps every @pyxis-llm/* version
# in lockstep and points the workspace:* links between them at that version
# (pnpm publish would rewrite them too; doing it first keeps the check below
# meaningful).
#
# The packages are one pnpm workspace: one install at the root, built in
# dependency order, published with pnpm.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "npm version to publish (e.g. 1.2.3); leave empty to use the tag the run is started on"
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          scope: "@pyxis-llm"

      # Build every package BEFORE anything is published, against the local
      # workspace links (so nothing is fetched from the registry mid-release).
      # A build failure here stops the run with nothing on npm.
      - name: Install the workspace
        run: pnpm install --frozen-lockfile
      - name: Build @pyxis-llm/client
        run: pnpm --filter @pyxis-llm/client run build
      - name: Build @pyxis-llm/core
        run: pnpm --filter @pyxis-llm/core run build
      - name: Build @pyxis-llm/react
        run: pnpm --filter @pyxis-llm/react run build

      # Rewrites every version (and the workspace: links between @pyxis-llm/*
      # packages) to the release version. Runs after the builds on purpose.
      - name: Set npm package versions
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ] && [ "$REF_TYPE" = "tag" ]; then
            version="$REF_NAME"
          fi
          if [ -z "$version" ]; then
            echo "::error::No version: enter one, or run the workflow on a release tag."
            exit 1
          fi
          node scripts/set-npm-versions.mjs --tag "$version"

      - name: "Refuse to publish a dev version or a local link"
        run: node scripts/check-npm-dev-version.mjs

      # --no-git-checks: set-npm-versions just edited the package.json files,
      # so the tree is (deliberately) not clean.
      - name: Publish @pyxis-llm/client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm --filter @pyxis-llm/client publish --access public --no-git-checks

      - name: Publish @pyxis-llm/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm --filter @pyxis-llm/core publish --access public --no-git-checks

      - name: Publish @pyxis-llm/react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm --filter @pyxis-llm/react publish --access public --no-git-checks
