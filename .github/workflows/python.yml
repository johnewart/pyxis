name: Python client

# Runs the pyxis-client tests on every push and pull request. The smoke test
# drives llmd-fake (llmd in-process plus a fake OpenAI server), built here and
# passed in through LLMD_FAKE_BIN; without it that test would only skip.

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pyxis-client tests
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Toolchain (CGO)
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build llmd-fake
        run: go build -o "$RUNNER_TEMP/llmd-fake" ./llmdtest/cmd/llmd-fake
      - name: Install pyxis-client with test extras
        run: python -m pip install "./packages/python-client[test]"
      - name: Run tests
        env:
          LLMD_FAKE_BIN: ${{ runner.temp }}/llmd-fake
        run: python -m pytest packages/python-client/tests
