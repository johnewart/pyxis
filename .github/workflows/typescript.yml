name: TypeScript packages

# Builds, type-checks and tests @pyxis-llm/client, @pyxis-llm/core and
# @pyxis-llm/react on every push and pull request.
#
# The packages are one pnpm workspace (pnpm-workspace.yaml): one install at the
# root, then each package builds in dependency order (client, core, react).
#
# Two jobs:
#   - unit: builds the three packages, type-checks client, runs the client
#     unit tests and react's jsdom unit suite. No Go needed.
#   - e2e: the client and react end-to-end suites, which build llmd from this
#     checkout and drive it against a built-in fake OpenAI server (no secrets).
#     They run on every push too, since a Go change can break them.

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  unit:
    name: Build, type-check and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm before setup-node: its pnpm cache needs pnpm on PATH. The version
      # comes from the root package.json's packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install the workspace
        run: pnpm install --frozen-lockfile
      - name: Build @pyxis-llm/client, core, react
        run: |
          pnpm --filter @pyxis-llm/client run build
          pnpm --filter @pyxis-llm/core run build
          pnpm --filter @pyxis-llm/react run build

      - name: Type-check @pyxis-llm/client
        working-directory: packages/client
        run: pnpm exec tsc -p tsconfig.json --noEmit
      - name: "@pyxis-llm/client unit tests"
        run: pnpm --filter @pyxis-llm/client test
      - name: "@pyxis-llm/react unit tests"
        run: pnpm --filter @pyxis-llm/react-e2e run test:unit

  e2e:
    name: End-to-end tests against llmd
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Toolchain (CGO)
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install the workspace
        run: pnpm install --frozen-lockfile
      - name: Build @pyxis-llm/client, core, react
        run: |
          pnpm --filter @pyxis-llm/client run build
          pnpm --filter @pyxis-llm/core run build
          pnpm --filter @pyxis-llm/react run build

      - name: "@pyxis-llm/client end-to-end tests"
        run: pnpm --filter @pyxis-llm/client-e2e test
      - name: "@pyxis-llm/react end-to-end tests"
        run: pnpm --filter @pyxis-llm/react-e2e test
