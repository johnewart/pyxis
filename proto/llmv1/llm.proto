// Lists every tool that exists for the caller's tenant (llmd-tenant-id
// metadata), independent of any session: the host's registered tools plus the
// executor tools registered for this tenant over ToolProviderService
// (including ones whose executor is currently disconnected). No session-level
// filtering is applied. Secrets in tool definitions are redacted.
message ListToolsRequest {}

message ListToolsResponse {
  repeated ToolDefinition tools = 1;
}

// Returns persisted chat messages for a session (same store ChatStream writes to when session_id is set).
message GetSessionHistoryRequest {
  string session_id = 2;
  // If > 0, return only the last N messages; 0 means full history.
  int32 max_messages = 3;
  // When true, return ONLY the turn/event-log status fields (turn_in_progress,
  // events_seq, turn_start_seq) and skip loading the transcript, attachments,
  // tracked documents and seed. Cheap enough to poll. The response echoes
  // status_only = true so an empty `messages` is never mistaken for an empty
  // session.
  bool status_only = 4;
}

// One raw persisted attachment row (mirrors llmd_chat_messages kind="attachment").
// content is the serialized attachment payload (includes the stored anchor message id);
// the client parses it the same way regardless of transport.
message SessionAttachmentRow {
  string content = 1;
  string tool_call_id = 2;
}

// One tracked-document version as attached to a session at a message, for UI display
// (badges + a content viewer). Mirrors a row of llmd_tracked_document_versions.
message TrackedDocumentRef {
  string document_id = 1;
  string name = 2;
  // 0-based version index for this document within the session.
  int32 version = 3;
  // The user message this version was attached to (badge anchor).
  string anchor_message_id = 4;
  // "initial" for version 0, "updated" for later versions.
  string change = 5;
  // Full snapshot content (front matter included) for the viewer.
  string content = 6;
}

message GetSessionHistoryResponse {
  repeated Message messages = 1;
  // Raw attachment rows for this session (ask cards + embedded build runs); client re-hydrates.
  repeated SessionAttachmentRow attachment_rows = 2;
  // Tracked-document versions attached across the session (for badges + viewer), oldest first.
  repeated TrackedDocumentRef tracked_documents = 3;
  // The session's first-turn context seed (graph status, etc.), or empty when none.
  string initial_seed = 4;
  // True while an assistant turn for this session is still running server-side
  // (e.g. the client navigated away mid-reply). The client should rejoin it via
  // SubscribeSessionEvents and refetch history once the turn finishes; the
  // messages above do not yet include that turn's reply.
  bool turn_in_progress = 5;
  // Session event-log head when this response was built. Subscribe with
  // after_seq = events_seq to receive only events that come after this history.
  int64 events_seq = 6;
  // When turn_in_progress: the event-log seq the running turn started after.
  // Subscribe with after_seq = turn_start_seq to rebuild that turn's reply live.
  int64 turn_start_seq = 7;
  // True when the request set status_only: messages, attachment_rows,
  // tracked_documents and initial_seed were NOT loaded and are empty regardless
  // of what the session contains. Only the status fields above are meaningful.
  bool status_only = 8;
  // When turn_in_progress: server wall-clock ms the running turn started (the
  // same instant as its UserTurnCommitted.committed_at_ms). 0 when unknown.
  int64 turn_started_at_ms = 9;
  // The session's most recently FINISHED turn, server wall-clock ms, so a
  // client opening the session can show how long it took. 0 when no turn has
  // finished since llmd started (kept in memory only).
  int64 last_turn_started_at_ms = 10;
  int64 last_turn_ended_at_ms = 11;
}

// Subscribe to session events for replay and subscription.
// When afterSeq=0, returns a snapshot followed by live deltas.
// When afterSeq>0, returns only events since that seq.
message SubscribeSessionEventsRequest {
  string session_id = 1;
  // When 0, return a snapshot of all events; when > 0, return only events since this seq.
  int64 after_seq = 2;
}

// Explicitly stop the session's in-flight assistant turn.
//
// A ChatStream turn runs on a server-owned context: the client going away
// (navigation, reload, network blip) does NOT cancel it — the turn finishes and
// is persisted, and a returning client rejoins via SubscribeSessionEvents.
// This RPC is the only way to cut a turn short. The streamed-so-far partial is
// salvaged and committed with finish_reason="cancelled" (or `reason` if set).
message CancelTurnRequest {
  string session_id = 1;
  // Optional finish_reason override for the salvaged partial; default "cancelled".
  string reason = 2;
}

message CancelTurnResponse {
  // True when a running turn was found and signalled; false when the session was idle.
  bool cancelled = 1;
}

// Replace all persisted chat messages for a session (e.g. after the client deletes/truncates transcript).
message ReplaceSessionHistoryRequest {
  string session_id = 2;
  repeated Message messages = 3;
}

message ReplaceSessionHistoryResponse {}

// Persist or replace one UI attachment row anchored to a message's turn.
message UpsertSessionAttachmentRequest {
  string session_id = 1;
  // Message whose turn this attachment anchors to. If that assistant row isn't flushed yet,
  // llmd falls back to the latest assistant turn so the attachment still persists.
  string anchor_message_id = 2;
  MessageAttachment attachment = 3;
}

message UpsertSessionAttachmentResponse {}

message DeleteSessionAttachmentRequest {
  string session_id = 1;
  string attachment_id = 2;
}

message DeleteSessionAttachmentResponse {}

// Splice updated content into a persisted assistant message (e.g. inline attachment tags after flush).
message PatchAssistantMessageContentRequest {
  string session_id = 1;
  string message_id = 2;
  string content = 3;
  // When set, only the assistant row for this turn is updated; otherwise the latest assistant row for the message.
  optional string turn_id = 4;
}

message PatchAssistantMessageContentResponse {}

// --- Registered LLM providers (YAML-backed registry in llmd) ---

enum LlmProviderType {
  LLM_PROVIDER_TYPE_UNSPECIFIED = 0;
  LLM_PROVIDER_TYPE_OPENAI = 1;
  LLM_PROVIDER_TYPE_OLLAMA = 2;
  LLM_PROVIDER_TYPE_ANTHROPIC = 3;
  LLM_PROVIDER_TYPE_CURSOR_CLI = 4;
  // Local Claude Code CLI (`claude` with --print); see go-agents/claude-cli-agent.ts.
  LLM_PROVIDER_TYPE_CLAUDE_CODE = 5;
  // Amazon Bedrock Converse / ConverseStream (AWS credentials; model IDs per region).
  LLM_PROVIDER_TYPE_BEDROCK = 6;
  // Claude Code CLI with headless --resume (stateful; incremental tail via ProviderSessionSync).
  LLM_PROVIDER_TYPE_CLAUDE_CODE_V2 = 7;
  // Google Gemini Developer API (go-genai).
  LLM_PROVIDER_TYPE_GEMINI = 8;
  // OpenRouter (OpenAI-compatible gateway to many upstream providers).
  LLM_PROVIDER_TYPE_OPENROUTER = 9;
