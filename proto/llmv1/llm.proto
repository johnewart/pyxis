syntax = "proto3";

package llm.v1;

import "google/protobuf/duration.proto";

option go_package = "github.com/johnewart/pyxis/gen/llmv1;llmv1";

// LLM API: unary chat/generate plus server-streaming chat with conversation events
// (aligned with ai-library TypeScript conversation_events + stream_types).

message ToolCall {
  string id = 1;
  string name = 2;
  // JSON object encoding tool arguments (e.g. "{\"location\":\"SF\"}").
  string arguments_json = 3;
  // Gemini 3+ requires thought_signature on functionCall parts when replaying tool history.
  bytes thought_signature = 4;
}

// UI/session artifact attached to a chat message (ask cards, embedded sessions,
// etc.). payload_json is client-facing display data and is NEVER sent to LLM
// providers. content is the OPPOSITE audience: when non-empty, llmd splices it
// verbatim into the outbound message sent to the provider (same mechanism as
// TrackedDocument injection) while the persisted message row itself is never
// mutated — so replaying history to a client never needs to strip anything.
// The two fields may both be set (e.g. an ask_card_response shows a structured
// answer to the client via payload_json while a synthesized natural-language
// summary rides in content for the model).
message MessageAttachment {
  string id = 1;
  string kind = 2;
  string payload_json = 3;
  // When set, UI inserts the hydrated artifact after this tool result within the parent turn.
  optional string after_tool_call_id = 4;
  // Provider-facing text, spliced into the outbound message at send-time.
  // Empty ⇒ this attachment is display-only (existing behavior, unchanged).
  string content = 5;
}

// AskCard / AskCardResponse are first-class llmd conversational vocabulary —
// a generic structured-question primitive (distinct from app-owned domain
// data like graph provenance, which stays a TurnDecoration pointer). llmd
// does not interpret these itself; they are typed shapes clients marshal into
// MessageAttachment.payload_json (via protojson) so every llmd-based app
// shares one canonical ask-card shape instead of reinventing the JSON
// contract. The response's card_id correlates it back to the AskCard it
// answers.
enum AskCardType {
  ASK_CARD_TYPE_UNSPECIFIED = 0;
  ASK_CARD_TYPE_CHOICE = 1;
  ASK_CARD_TYPE_TEXT = 2;
  ASK_CARD_TYPE_FILE = 3;
}

message AskChoiceCard {
  // Option labels. Always set (also when options is), so older clients work.
  repeated string choices = 1;
  // false = single-select (radio), true = multi-select (checkboxes).
  bool allow_multiple = 2;
  // Optional per-option explanations, same order as choices.
  repeated AskChoiceOption options = 3;
}

message AskChoiceOption {
  string label = 1;
  // One line: what happens if the user picks this option.
  string description = 2;
  // Non-empty marks the option as recommended and says why. At most one
  // option on a card carries it.
  string recommendation = 3;
}

message AskFileCard {
  // Advisory only (client-side hint); empty = any file type accepted.
  repeated string accepted_mime_types = 1;
}

message AskCard {
  string id = 1;
  string title = 2;
  string text = 3;
  AskCardType type = 4;
  // When true, the client also offers a free-text field alongside the
  // primary answer (choice/file), independent of type = TEXT.
  bool allow_additional_text = 5;
  oneof body {
    AskChoiceCard choice = 6;
    AskFileCard file = 7;
    // TEXT needs no body — title/text carries the whole question.
  }
}

message AskChoiceResponse {
  repeated string selected = 1;
}

message AskFileResponse {
  string file_name = 1;
  string mime_type = 2;
  int64 size_bytes = 3;
  // Raw file bytes. protojson encodes/decodes this as base64 automatically —
  // no manual base64 handling needed at the client/server boundary.
  bytes content = 4;
}

message AskCardResponse {
  // Correlator: the AskCard.id being answered.
  string card_id = 1;
  AskCardType type = 2;
  string additional_text = 3;
  oneof body {
    AskChoiceResponse choice = 4;
    AskFileResponse file = 5;
  }
}

// A tracked document attached to a turn: the full CURRENT body (frontmatter
// included) of a plan/design/idea etc. as of when the user sent the message.
// llmd hash-dedups these into immutable version snapshots and injects them into
// the OUTBOUND model messages at send time; the persisted user message stays
// exactly what the user typed. document_id is the document's stable identity
// across turns (docUuid, or a review id) and is opaque to llmd.
message TrackedDocument {
  string document_id = 1;
  string name = 2;
  string content = 3;
}

message Message {
  // "system" | "user" | "assistant" | "tool"
  string role = 1;
  // User-visible message body (never raw <thinking>…</thinking> regions).
  string content = 2;
  string id = 3;
  repeated ToolCall tool_calls = 4;
  // For role "tool": id of the tool_use block this result answers.
  string tool_call_id = 5;
  // Model reasoning / chain-of-thought for role "assistant" (optional).
  // Same turn as content and tool_calls; not shown as the main answer in UI.
  // History replay: OpenAI-compatible APIs may map this to reasoning_content where supported;
  // Ollama and other single-string assistants omit this field (content only).
  string thinking_content = 6;
  // User-facing activity headline for this assistant turn (optional). Not chain-of-thought; may be
  // sourced from <activity>...</activity> during streaming and persisted for replay / debugging.
  string activity_headline = 7;
  repeated MessageAttachment attachments = 8;
  // Per-turn token usage (populated for assistant messages when history is loaded with usage data).
  optional TokenUsage usage = 9;
  // Completion status for an assistant turn (e.g. "end_turn", "tool_use", "stop", "cancelled").
  // Optional; empty for user/system/tool messages. Persisted on the assistant content row.
  string finish_reason = 10;
  // Wall time, in ms, of the one model call that produced this assistant message
  // (one round of the tool loop). Unset when it was not recorded (older turns).
  optional int64 model_duration_ms = 11;
}

// Cross-provider cache hints. Each backend maps only what it supports (e.g.
// Anthropic prompt caching); others ignore unused fields.
message CacheOptions {
  // Reuse of large/static prompt segments where the provider has a mechanism.
  enum PromptCacheMode {
    PROMPT_CACHE_MODE_UNSPECIFIED = 0;
    PROMPT_CACHE_MODE_DISABLED = 1;
    PROMPT_CACHE_MODE_SHORT_TTL = 2;
    PROMPT_CACHE_MODE_LONG_TTL = 3;
  }
  PromptCacheMode prompt_cache_mode = 1;
}

// Per-turn Claude Code CLI overrides (client model profiles).
message ClaudeCodeCallOptions {
  // "low" | "medium" | "high" | "xhigh" | "max"
  optional string effort = 1;
  optional double max_budget_usd = 2;
  // When set, passed to --model instead of CallOptions.model (catalog profile id vs base model id).
  optional string base_model = 3;
  // "enabled" | "disabled" | "adaptive" — overrides provider thinking when set.
  optional string thinking_type = 4;
  optional int32 thinking_budget_tokens = 5;
}

// Per-turn OpenRouter routing overrides.
message OpenRouterCallOptions {
  enum Sort {
    SORT_UNSPECIFIED = 0;
    SORT_PRICE = 1;
    SORT_THROUGHPUT = 2;
    SORT_LATENCY = 3;
  }
  Sort sort = 1;
  // Preferred upstream provider names, in order.
  repeated string order = 2;
  // Restrict routing to only these upstream providers.
  repeated string only = 3;
  // Upstream providers to skip.
  repeated string ignore = 4;
  // Whether OpenRouter may fall back to other upstream providers.
  optional bool allow_fallbacks = 5;
}

// Structured responses: ask the provider to emit machine-readable output
// instead of prose the caller has to scrape.
//
// Backends map this to whatever they support and IGNORE it otherwise, the same
// contract as CacheOptions. This is a best-effort hint, never a guarantee:
//   - openai   -> response_format json_schema / json_object
//   - gemini   -> response_mime_type + response_schema
//   - ollama   -> format
//   - anthropic/bedrock -> no JSON mode; equivalent is forcing a single tool call
//   - claudecode/cursorcli -> CLI-driven, cannot express this at all
// Callers MUST still tolerate non-conforming output (prose, fenced JSON, a
// trailing remark) rather than assuming the field was honoured.
message ResponseFormat {
  enum Kind {
    // No constraint — ordinary free-text completion.
    RESPONSE_FORMAT_KIND_UNSPECIFIED = 0;
    // Any syntactically valid JSON object; shape is up to the prompt.
    RESPONSE_FORMAT_KIND_JSON_OBJECT = 1;
    // Must conform to json_schema. Backends without schema support fall back to
    // JSON_OBJECT behaviour rather than failing the call.
    RESPONSE_FORMAT_KIND_JSON_SCHEMA = 2;
  }
  Kind kind = 1;
  // JSON Schema (draft 2020-12) encoded as a JSON string. Required when kind is
  // JSON_SCHEMA; ignored otherwise. A string rather than google.protobuf.Struct
  // so callers can pass a schema through verbatim without a lossy round trip.
  string json_schema = 2;
  // Schema name, for providers that require one (OpenAI). Defaults server-side
  // when empty.
  string schema_name = 3;
  // Ask the provider to reject non-conforming output where it can (OpenAI
  // strict mode). Advisory: backends without the capability ignore it.
  bool strict = 4;
}

message CallOptions {
  // Overrides server default model when set.
  string model = 1;
  int32 max_tokens = 2;
  optional float temperature = 3;
  optional float top_p = 4;
  optional int64 top_k = 5;

  CacheOptions cache_options = 6;
  // Max provider rounds that include tool calls before stopping (0 = server default, e.g. 16).
  optional int32 max_tool_rounds = 7;
  // When true, this Chat/ChatStream turn must not mutate scope state (query tools only).
  optional bool read_only = 8;
  ClaudeCodeCallOptions claude_code = 9;
  // Structured-output request for this turn. Applies to Chat, ChatStream and
  // GenerateOnce so one-shot utilities and agent turns share one mechanism.
  ResponseFormat response_format = 10;
  // Overrides the session's bound LLM provider for this turn, when set and
  // non-empty. ChatStream compares this (and model, above) against the
  // session's current binding and reconciles automatically — persisting the
  // new provider/model onto the session and running the same stateful/
  // non-stateful history reconciliation UpdateSessionLlm triggers — so a
  // caller changing models mid-conversation does not need a separate
  // EnsureSession/UpdateSessionLlm round trip first. Empty means "keep the
  // session's current provider".
  optional string provider_id = 11;
  // Controls whether and which tool the model must call this turn. Unset or
  // UNSPECIFIED behaves exactly like AUTO.
  ToolChoice tool_choice = 12;
  OpenRouterCallOptions openrouter = 13;
  // Per-attempt provider call timeout in milliseconds (0 or unset = server
  // default).
  optional int32 attempt_timeout_ms = 14;
  // Max provider call attempts including the first (0 or unset = server
  // default).
  optional int32 max_attempts = 15;
  // When enabled, the last allowed tool round sends no tools and appends
  // the instruction as a transient user message.
  FinalRoundOptions final_round = 16;
  // How tool-call-like text emitted in assistant content is handled.
  // Unspecified behaves exactly like STRIP.
  TextToolCallMode text_tool_call_mode = 17;
}

enum TextToolCallMode {
  // Same as STRIP.
  TEXT_TOOL_CALL_MODE_UNSPECIFIED = 0;
  // Remove text-form tool calls from assistant content.
  TEXT_TOOL_CALL_MODE_STRIP = 1;
  // Convert text-form tool calls in assistant content into structured
  // (real) tool calls.
  TEXT_TOOL_CALL_MODE_CONVERT = 2;
}

// Configures the final-round behavior of a turn. When enabled, the last
// allowed round sends no tools and appends instruction as a transient user
// message (not persisted to history).
message FinalRoundOptions {
  // Turns the final-round behavior on.
  bool enabled = 1;
  // Text appended as a transient user message on the final round.
  string instruction = 2;
}

// Constrains tool selection for a turn. Backends map this to their native
// tool-choice setting.
message ToolChoice {
  enum Mode {
    // Same as AUTO.
    MODE_UNSPECIFIED = 0;
    // Model decides whether to call a tool.
    MODE_AUTO = 1;
    // Model must not call any tool.
    MODE_NONE = 2;
    // Model must call at least one tool (any of the supplied tools).
    MODE_REQUIRED = 3;
    // Model must call the tool given in name.
    MODE_NAMED = 4;
  }
  Mode mode = 1;
  // Tool name. Required when mode is NAMED and must match a supplied tool;
  // ignored otherwise.
  string tool_name = 2;
}

// Stateless one-shot generation: no agent, no session, no persistence. The
// caller supplies the provider explicitly (model via options.model). Used by
// utility one-shots (provider setup-wizard probe, plan/design summaries) that
// have an explicit provider/model but no chat session. Enabled-model validation
// is intentionally skipped so onboarding can probe a not-yet-enabled model.
message GenerateOnceRequest {
  string system_prompt = 1;
  string prompt = 2;
  CallOptions options = 3;
  // Provider to run against; falls back to the server default when empty. The
  // model comes from options.model (falls back to the provider's default_model).
  optional string provider_id = 4;
  // Optional multi-part user message. Mutually exclusive with prompt (setting
  // both is InvalidArgument). Parts may mark cache breakpoints.
  repeated PromptPart prompt_parts = 5;
}

// One part of a multi-part user prompt.
message PromptPart {
  string text = 1;
  // Ask providers that support prompt caching to cache the prompt up to and
  // including this part.
  bool cache_breakpoint = 2;
}

// Stateless completion request used by Complete and CompleteStream.
message CompleteRequest {
  // Conversation so far. Messages may include assistant messages carrying
  // tool_calls and role=tool messages carrying tool results.
  repeated Message messages = 1;
  CallOptions options = 2;
  // Provider to run against; falls back to the server default when empty.
  string provider_id = 3;
  // Optional tool definitions the model may call. ToolDefinitions carry no
  // execution binding: calls are returned to the caller and never run by llmd.
  repeated ToolDefinition tools = 4;
  // Optional system prompt.
  optional string system = 5;
}

message CompleteResponse {
  AssistantReply reply = 1;
}

// One frame of a CompleteStream. A dedicated oneof is used instead of reusing
// ConversationStreamFrame because that message is tied to sessions and
// persisted conversation state, which stateless completions do not have.
message CompleteStreamResponse {
  oneof frame {
    // Incremental assistant text.
    string content_delta = 1;
    // Incremental thinking text.
    string thinking_delta = 2;
    // A tool call requested by the model; returned, never executed.
    ToolCall tool_call = 3;
    // Last frame: full reply including tool calls and token usage.
    AssistantReply final_reply = 4;
  }
}

message AssistantReply {
  // Final user-visible assistant text for this turn.
  string content = 1;
  string id = 2;
  repeated ToolCall tool_calls = 3;
  string finish_reason = 4;
  // Accumulated thinking / reasoning for this turn (same id as content).
  string thinking_content = 5;
  // Latest user-facing activity headline for this turn when the provider emits status snapshots.
  string activity_headline = 6;
  TokenUsage usage = 7;
  // Upstream provider that actually served the request (e.g. via OpenRouter); empty when unknown.
  string served_by = 8;
}

// Server-side or built-in tools executed inside llmd's process (handlers
// installed via llmdhost.Config.Tools / llmdtools). Tools served by another
// process or module use ToolExecutionExecutor instead.
message ToolExecutionInlineBuiltin {}

// llmd POSTs JSON to url; response body is the tool result (UTF-8 text or JSON stringified by caller).
//
// Typed result (opt-in): a 2xx response whose Content-Type media type is
// application/json (parameters such as charset are ignored) and whose body is
// exactly a JSON object {"content": string, "is_error": bool, "ends_turn":
// bool} is treated as typed. "content" is required and becomes the tool
// result; is_error=true marks the call failed; ends_turn=true on a successful
// call asks the server to end the turn after the current tool round. Unknown
// fields, a missing content, trailing data, or another Content-Type make the
// body NOT typed: the raw body is then the result and the call succeeds, as
// before. Non-2xx responses are always failures.
message ToolExecutionHttpWebhook {
  string url = 1;
  // 0 = server default timeout for webhook tools.
  int32 timeout_seconds = 2;
  optional string bearer_token = 3;
  // If set, hex-encoded HMAC-SHA256 of the raw JSON body, sent as X-Llmd-Signature.
  optional string hmac_secret = 4;
}

// Client runs the tool; llmd blocks until the result arrives (or timeout).
// Results come back either via unary SubmitToolResults (ChatStream clients) or,
// when a legacy ToolProviderHello stream is connected for the exact
// (tenant, scope), as ToolExecutionInvoke/ToolExecutionResult frames on
// ToolProviderService.Connect. For host-served tools prefer ToolExecutionExecutor.
message ToolExecutionDelegateToClient {
  // 0 = server default wait for the client (e.g. 120 seconds).
  int32 timeout_seconds = 1;
}

enum ToolClassification {
  TOOL_CLASSIFICATION_UNSPECIFIED = 0;
  TOOL_CLASSIFICATION_QUERY = 1;
  TOOL_CLASSIFICATION_MUTATION = 2;
}

// Declares a callable tool the model may use (JSON Schema for arguments).
// parameters_schema_json should be a JSON object with at least
// "type": "object" and "properties" (OpenAI-style / JSON Schema draft subset).
message ToolDefinition {
  string name = 1;
  string description = 2;
  string parameters_schema_json = 3;
  oneof execution {
    ToolExecutionInlineBuiltin inline_builtin = 10;
    ToolExecutionHttpWebhook http_webhook = 11;
    ToolExecutionDelegateToClient delegate_to_client = 12;
    ToolExecutionExecutor executor = 14;
  }
  ToolClassification classification = 13;
  // Execution order hint: lower runs first; unset means default. Affects
  // execution order only, not transcript order.
  optional int32 priority = 15;
}

// Execution binding: the tool runs on a connected executor (ToolProviderService
// stream that sent ExecutorHello) identified by executor_id.
message ToolExecutionExecutor {
  string executor_id = 1;
  // Upper bound on a single call; 0 ⇒ server default.
  uint32 max_duration_seconds = 2;
}

// --- Session-scoped chat runtime (client chat) ---

// What an UNLISTED server-wide tool means for a session.
//
// A purely subtractive model cannot express an allowlist: a profile that wants
// exactly read_code would have to enumerate every other tool as disabled, and
// any tool registered server-wide AFTERWARDS would be silently gained by every
// session configured before it. PROFILE_ONLY closes that by making silence mean
// no.
enum ToolPolicy {
  // Treated as INHERIT_SERVER_WIDE: an unset policy must not change the
  // behaviour of a caller written before this field existed.
  TOOL_POLICY_UNSPECIFIED = 0;
  // Every server-wide tool is visible unless named in disabled_tools.
  TOOL_POLICY_INHERIT_SERVER_WIDE = 1;
  // The session sees ONLY core tools (internal/coretools) and the tools it
  // registered itself — initial_tools, which is where an agent profile's
  // enabled mappings land, plus any later RegisterSessionTool. A tool
  // reachable only because it is registered server-wide is NOT in the set,
  // whether it was registered before or after this session existed.
  TOOL_POLICY_PROFILE_ONLY = 2;
}

message EnsureSessionRequest {
  string session_id = 1;
  optional string display_name = 2;
  repeated ToolDefinition initial_tools = 3;
  optional string llm_provider_id = 4;
  optional string default_model = 5;
  // Session-level default system prompt sections (client-authored), set once here
  // instead of on every ChatStreamRequest. Persisted on the session (llmd_sessions);
  // when non-empty, EnsureSession REPLACES the persisted default wholesale (not a
  // merge) so a caller can deliberately clear it back to empty by omitting it — but
  // note that an idempotent EnsureSession call made without repeating this field
  // (e.g. a reconnect that only wants to touch llm_provider_id) also leaves the
  // existing persisted default untouched; only an EXPLICIT non-empty list overwrites.
  // ChatStreamRequest.system_prompt_sections, when set, still overrides this default
  // for that turn only — the persisted default is unaffected either way.
  repeated SystemPromptSection system_prompt_sections = 6;
  // Session surface / agent type (build, ask, debug, doc, pair).
  //
  // Previously a surface could only be set through SetSessionMeta, which meant
  // there was no way to establish it when the session was created. Omitting it
  // on a later idempotent ensure leaves the stored surface untouched rather than
  // clearing it, so it is safe to send only on the first call.
  optional string chat_surface = 7;
  // Server-wide tool names this session may neither see NOR call.
  //
  // DENY WINS: the exclusion is applied last and is not undone by the session
  // registering the same tool name itself (initial_tools or
  // RegisterSessionTool). It used to be, which made the exclusion cosmetic —
  // registering a session tool is reachable by any client, so anything blocked
  // could be unblocked by naming it. Core session tools (see
  // internal/coretools) are never hidden regardless of this list.
  //
  // This is enforced, not merely advertised: a disabled tool is absent from the
  // model-facing tool list and from ListSessionTools, AND calling it anyway —
  // via the ChatStream tool loop or the unary InvokeTool RPC — is refused with
  // PermissionDenied.
  //
  // Same overwrite rule as system_prompt_sections: only an EXPLICIT non-empty
  // list replaces the persisted set on a later EnsureSession; omitting it
  // leaves the stored set untouched.
  repeated string disabled_tools = 8;
  // Fate of server-wide tools this session neither registered nor disabled.
  // Unset = TOOL_POLICY_INHERIT_SERVER_WIDE (today's behaviour). Persisted on
  // the session; like disabled_tools, an EnsureSession that omits it leaves
  // the stored policy untouched, so a reconnect cannot silently widen a
  // PROFILE_ONLY session.
  ToolPolicy tool_policy = 9;
  // On an EXISTING session, make initial_tools the session's tool set: tools
  // it has that are not listed are removed, listed ones are added or
  // replaced. Without it initial_tools is honoured only when the session is
  // created, and a server-installed tool can never be removed afterwards
  // (UnregisterSessionTool refuses them) - so a session would keep, forever,
  // a tool its agent no longer has.
  //
  // Client-delegated tools (delegate_to_client) are left alone: clients own
  // those and reconcile them before every turn. Core tools are not session
  // registrations and are unaffected. Ignored when the session is new
  // (initial_tools is the whole set then anyway).
  bool replace_tools = 10;
  // Client-supplied key/value context that llmd stores on the session and
  // passes unchanged to every tool call in the turn (ExecutorToolCall.tool_context).
  // llmd never interprets it. ChatStreamRequest.tool_context overrides it per
  // turn; when that is unset or empty, this session map is used.
  map<string, string> tool_context = 11;
}

message EnsureSessionResponse {}

// --- Agent profiles ---
//
// An agent profile is a reusable configuration bundle (system prompt sections,
// provider/model defaults, memory flag, tool mapping) that is RESOLVED at
// session-creation time by CreateSessionFromAgentProfile. Sessions never
// reference a profile afterwards; editing a profile does not affect sessions
// already created from it.

// One entry of an AgentProfile's tool mapping.
//
// enabled = true  → the named server-wide tool is cloned into the session's
//                   initial_tools when a session is created from the profile.
// enabled = false → the tool name is listed in the session's disabled_tools
//                   (EnsureSessionRequest.disabled_tools), which both hides it
//                   and refuses it at dispatch. Deny wins: a per-session
//                   registration of the same name does NOT bring it back.
// Core session tools (see internal/coretools) can never be disabled; a profile
// carrying an enabled = false mapping that names one is REJECTED by Validate
// rather than silently ignored.
//
// Under TOOL_POLICY_PROFILE_ONLY a profile needs no negative mappings at all:
// silence already means no, so listing only the enabled tools is the allowlist.
message ToolMapping {
  string tool_name = 1;
  bool enabled = 2;
}

message AgentProfile {
  string id = 1;
  string name = 2;
  string description = 3;
  // Materialized into EnsureSessionRequest.system_prompt_sections.
  repeated SystemPromptSection system_prompt_sections = 4;
  optional string llm_provider_id = 5;
  optional string default_model = 6;
  bool memory_enabled = 7;
  repeated ToolMapping tool_mapping = 8;
  // RFC3339 timestamps. Empty for static (code-defined) profiles.
  string created_at = 9;
  string updated_at = 10;
  // Static profiles are defined in code and are read-only: Create/Update/Delete
  // refuse them.
  bool is_static = 11;
  // Materialized into EnsureSessionRequest.tool_policy. PROFILE_ONLY makes
  // tool_mapping an allowlist: only the enabled entries (plus core tools) reach
  // the session, so a tool registered server-wide later cannot leak in.
  ToolPolicy tool_policy = 12;
  // The fields of this profile that come from the workspace's overlay, not
  // from its static base. Empty for dynamic profiles and for a static profile
  // with no overlay.
  repeated AgentProfileOverlayField customized = 13;
}

// A field of a static profile that an overlay can change.
enum AgentProfileOverlayField {
  AGENT_PROFILE_OVERLAY_FIELD_UNSPECIFIED = 0;
  AGENT_PROFILE_OVERLAY_FIELD_LLM_PROVIDER = 1;
  AGENT_PROFILE_OVERLAY_FIELD_DEFAULT_MODEL = 2;
  AGENT_PROFILE_OVERLAY_FIELD_MEMORY_ENABLED = 3;
  AGENT_PROFILE_OVERLAY_FIELD_TOOLS = 4;
  AGENT_PROFILE_OVERLAY_FIELD_SYSTEM_PROMPT = 5;
}

// A workspace's changes to one static (code-defined) profile. The base stays
// read-only and is always the host's current definition; the overlay is
// applied on top of it whenever the profile is resolved, so an upgrade of the
// base never conflicts with the user's changes.
//
// Merge rules:
// - llm_provider_id, default_model, memory_enabled: replace the base value
//   when set.
// - tool_overrides: each entry sets that tool's enabled flag, adding a
//   mapping when the base has none. Tools the base adds later and the overlay
//   does not name keep the base's setting.
// - section_replacements: replace the content of the base section with the
//   same id. An id the base no longer has is ignored.
// - extra_sections: appended after the base's sections. Their ids must not
//   collide with a base section id.
message AgentProfileOverlay {
  string base_id = 1;
  optional string llm_provider_id = 2;
  optional string default_model = 3;
  optional bool memory_enabled = 4;
  repeated ToolMapping tool_overrides = 5;
  repeated SystemPromptSection section_replacements = 6;
  repeated SystemPromptSection extra_sections = 7;
  // RFC3339; empty when no overlay is stored.
  string updated_at = 8;
}

message GetAgentProfileOverlayRequest {
  string base_id = 1;
}

// overlay is empty (only base_id set) when the workspace has none. base is
// the static profile without the overlay, so a UI can show what it changes.
