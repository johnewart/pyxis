  // Optional STS AssumeRole: role to assume on top of the default credential chain.
  optional string assume_role_arn = 6;
  // Session name used for AssumeRole.
  optional string role_session_name = 7;
  // External ID passed to AssumeRole. Secret: never log or return it in clear text.
  optional string external_id = 8;
}

