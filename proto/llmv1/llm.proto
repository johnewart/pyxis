  optional string binary = 1;
  optional string cwd = 2;
  optional string agent = 3;
  optional string default_model = 4;
  optional string system_prompt = 5;
  optional string append_system_prompt = 6;
  // "low" | "medium" | "high" | "xhigh" | "max"
  optional string effort = 7;
  // e.g. default, acceptEdits, bypassPermissions, dontAsk, plan
  optional string permission_mode = 8;
  optional double max_budget_usd = 9;
  repeated string add_dir = 10;
  repeated string allowed_tools = 11;
  repeated string disallowed_tools = 12;
  optional string mcp_config_path = 13;
  optional int32 timeout_ms = 14;
  optional int32 max_turns = 15;
  // CLI --setting-sources values: user, project, local
  repeated string setting_sources = 16;
  // Thinking config merged into --settings (enabled, disabled, adaptive).
  optional string thinking_type = 17;
  optional int32 thinking_budget_tokens = 18;
  // JSON object merged into --settings hooks key.
  optional string hooks_json = 19;
  optional bool strict_mcp_config = 20;
  optional bool include_hook_events = 21;
  // Directory for Claude Code settings (sets CLAUDE_CONFIG_DIR on the CLI process).
  optional string config_dir = 22;
  // When true, load the user's own Claude config (~/.claude). By default --bare is passed
  // to avoid conflicts (e.g. plan mode being stuck on from personal settings).
  optional bool use_my_claude_config = 23;
  // When true, enable Claude Code's ToolSearch so MCP tool schemas are deferred
  // (loaded on demand) — client token-saver opt-in. Default false: all tool
  // schemas are sent eagerly and ToolSearch is not exposed.
  optional bool defer_tool_schemas = 24;
  // When true, use Claude Code's own built-in preset system prompt (its assistant
  // identity/persona plus an automatic <env> block disclosing cwd, platform, OS
  // version, and today's date). Default false: the client sends only explicitly
  // configured system content (system_prompt / append_system_prompt / the chat's
  // system message) and nothing else — no Claude Code persona, no automatic
  // environment disclosure, and no system prompt at all when none of those are set.
  optional bool use_claude_code_preset = 25;
  // Long-lived OAuth token from `claude setup-token`. When set, it is passed to the
  // CLI as CLAUDE_CODE_OAUTH_TOKEN; any ambient value in llmd's own environment is
  // always stripped so each provider authenticates only with its own credentials.
  optional string oauth_token = 26;
}

