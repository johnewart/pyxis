// Scan the machine llmd is running on for installations of a CLI-backed
// provider's binary (Claude Code, Cursor Agent).
//
// This exists because llmd is often not running where the user is looking: the
// provider UI is in a browser, while llmd may be in a container, on a remote
// host, or under a launcher whose PATH bears no resemblance to the user's login
// shell. "Type the path to your claude binary" is unanswerable from there.
//
// Registration performs this scan implicitly when a CLI provider is created
// with no binary set; this RPC is the same scan made explicit, so a client can
// show what is available (and at which versions) before committing.
message DiscoverProviderBinariesRequest {
  LlmProviderType provider_type = 1;
  // Optional path to check instead of scanning. When set, the response
  // describes just this path -- discovery never second-guesses an explicit
  // choice, it only reports whether that choice works.
  optional string binary = 2;
}

// One binary installation the scan found. Installations that are present but
// unusable (won't execute, below the supported version floor) are reported with
// usable=false rather than omitted: "found it, but it's too old" is far more
// actionable than "found nothing".
message DiscoveredProviderBinary {
  // Absolute, symlink-resolved path to the binary.
  string path = 1;
  // The CLI's self-reported version; empty if it could not be read.
  string version = 2;
  // Why this path was considered: "override", "env", "path", "well_known".
  string source = 3;
  // The environment variable name or directory this came from, for display.
  string origin = 4;
  // Whether this binary ran and met any applicable version floor.
  bool usable = 5;
  // When usable is false, a user-facing sentence explaining why.
  string error = 6;
}

message DiscoverProviderBinariesResponse {
  // Best candidate first; usable entries sort ahead of unusable ones. Empty
  // when nothing was found at all.
  repeated DiscoveredProviderBinary binaries = 1;
  // The directories and environment variables that were searched, so a client
  // can tell the user where llmd actually looked when the list comes back empty.
  repeated string searched = 2;
}

// Why a connection check failed, as something a client can branch on.
//
// The human-readable message is not enough: "not signed in" and "binary is
// missing" need completely different UI (a sign-in button vs install
// instructions), and substring-matching a sentence written for humans is not a
// contract. Clients should switch on this and use `message` only for display.
enum ProviderConnectionStatus {
  PROVIDER_CONNECTION_STATUS_UNSPECIFIED = 0;
  // The CLI is present, new enough, authenticated, and can resume sessions.
  PROVIDER_CONNECTION_STATUS_OK = 1;
  // No CLI at the configured path, or none found on this machine.
  PROVIDER_CONNECTION_STATUS_BINARY_NOT_FOUND = 2;
  // Found and runs, but older than llmd's supported minimum.
  PROVIDER_CONNECTION_STATUS_VERSION_TOO_OLD = 3;
  // Works, but has no valid credentials. THIS is the one the user can fix:
  // drive an interactive login (RunProviderAuthCommand) and check again.
  PROVIDER_CONNECTION_STATUS_NOT_AUTHENTICATED = 4;
  // The CLI cannot do headless session resume, which llmd requires.
  PROVIDER_CONNECTION_STATUS_RESUME_UNSUPPORTED = 5;
  // The CLI never exited within the timeout.
  PROVIDER_CONNECTION_STATUS_TIMED_OUT = 6;
  // Ran, failed, cause not classifiable -- see `details`.
  PROVIDER_CONNECTION_STATUS_FAILED = 7;
}

// Check whether a CLI-backed provider config can actually be used, WITHOUT
// registering it: does the binary exist, is it new enough, is it signed in, can
// it resume sessions.
//
// This is the "Connect"/"Test" button behind a provider form. Registration runs
// the same checks, but only tells you pass/fail by succeeding or returning one
// opaque error, and it persists on success -- so it cannot answer "is this
// config any good?" before the user commits to it, and it cannot say "you just
// need to sign in" in a way a UI can act on.
//
// COST: for Claude Code this makes two real (cheap, haiku) model calls, because
// headless resume cannot be verified any other way. Treat it as an explicit
// user action, not something to run on every keystroke or form render.
message CheckProviderConnectionRequest {
  LlmProviderType provider_type = 1;
  // Optional binary path. Empty means "scan this machine for it", matching what
  // registration does with an unset binary.
  optional string binary = 2;
  // Optional working directory for the CLI subprocess.
  optional string cwd = 3;
  // Optional CLAUDE_CONFIG_DIR-style config directory. Pass the SAME value the
  // provider uses (and that RunProviderAuthCommand was given): credentials are
  // stored per config directory, so omitting it checks a different account than
  // the one the user signed into.
  optional string config_dir = 4;
  // Optional overall timeout. Defaults to llmd's probe default (120s).
  optional uint32 timeout_ms = 5;
  // Optional CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`). Pass the SAME
  // value the provider will be registered with, so the check authenticates as
  // the provider will. Ambient values in llmd's environment are never used.
  optional string oauth_token = 6;
  // Optional provider config to check, mirroring RegisterLlmProviderRequest.config.
  // When set, the check uses these settings (region, credentials, base URL, ...)
  // instead of defaults. Existing clients that leave it unset are unaffected.
  oneof config {
    AnthropicLlmConfig anthropic = 7;
    OpenAiLlmConfig openai = 8;
    OllamaLlmConfig ollama = 9;
    CursorCliLlmConfig cursor_cli = 10;
    ClaudeCodeLlmConfig claude_code = 11;
    BedrockLlmConfig bedrock = 12;
    GeminiLlmConfig gemini = 13;
    OpenRouterLlmConfig openrouter = 14;
  }
}

// Where the credentials used by a connection check came from.
enum CredentialSource {
  CREDENTIAL_SOURCE_UNSPECIFIED = 0;
  // The provider's default credential chain (environment, shared files, metadata service).
  CREDENTIAL_SOURCE_DEFAULT_CHAIN = 1;
  // Credentials from an assumed role (STS AssumeRole).
  CREDENTIAL_SOURCE_ASSUMED_ROLE = 2;
  // Credentials from a web identity token (e.g. OIDC / IRSA).
  CREDENTIAL_SOURCE_WEB_IDENTITY = 3;
  // An API key supplied in the config.
  CREDENTIAL_SOURCE_API_KEY = 4;
  // A named profile or shared credentials file.
  CREDENTIAL_SOURCE_PROFILE = 5;
  // A bearer token supplied in the config.
  CREDENTIAL_SOURCE_BEARER_TOKEN = 6;
  // No credentials were used or found.
  CREDENTIAL_SOURCE_NONE = 7;
}

// Identity of the caller as reported by the provider (e.g. AWS STS GetCallerIdentity).
message CallerIdentity {
  // Account identifier (e.g. AWS account ID).
  string account = 1;
  // ARN of the calling principal.
  string arn = 2;
  // Unique ID of the calling principal.
  string user_id = 3;
}

message CheckProviderConnectionResponse {
  ProviderConnectionStatus status = 1;
  // Absolute path of the binary actually probed, when one was resolved. Worth
  // showing: "which claude is it even running" is a common source of confusion
  // when several installs exist.
  string binary = 2;
  // The CLI's self-reported version, when it could be read.
  string version = 3;
  // User-facing explanation. Display this; do not parse it.
  string message = 4;
  // Diagnostic detail (CLI stderr, parse errors). For logs and "show details".
  string details = 5;
  // Convenience mirror of status == NOT_AUTHENTICATED, so a client can gate a
  // sign-in affordance without enumerating the status enum.
  bool needs_auth = 6;
  // Structured error when the check failed at the provider; unset on success.
  LlmError error = 7;
  // Where the credentials used for the check came from.
  CredentialSource credential_source = 8;
  // Non-fatal warnings (e.g. default model not found); display, do not parse.
  repeated string warnings = 9;
  // ARN of the role that was assumed, when credentials came from an assumed role.
  string assumed_role_arn = 10;
  // Identity the credentials resolved to, when the provider can report it.
  CallerIdentity caller_identity = 11;
}

// Scope: intentionally generic (provider_type, not "claude-specific" wire
// shapes) so other CLI providers needing interactive auth (Cursor CLI, etc.)
// can reuse it; today only LLM_PROVIDER_TYPE_CLAUDE_CODE /
// LLM_PROVIDER_TYPE_CLAUDE_CODE_V2 are implemented server-side.
message ProviderAuthCommandStart {
  LlmProviderType provider_type = 1;
  // Optional CLI binary override (falls back to the provider's configured/default binary).
  optional string binary = 2;
  // Optional CLAUDE_CONFIG_DIR-style config directory override.
  optional string config_dir = 3;
  uint32 cols = 4;
  uint32 rows = 5;
}

message ProviderAuthCommandResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

// ---------------------------------------------------------------------------
// Session-based provider auth: RunProviderAuthCommand decomposed into
// unary + server-streaming calls.
//
// WHY THIS EXISTS ALONGSIDE RunProviderAuthCommand: interactive CLI login has
// no headless equivalent (`claude setup-token` is interactive too), so it needs
// a PTY, which is naturally bidirectional. But gRPC-Web has no wire encoding
// for client-streaming or bidi calls at all -- it can only do unary and
// server-streaming. A browser therefore cannot call RunProviderAuthCommand,
// ever. That is a protocol limit, not an implementation gap.
//
// So the same PTY is exposed as three calls a browser CAN make: start it (unary,
// returns an id), read from it (server-streaming), write to it (unary). llmd
// holds the PTY between calls, keyed by session id.
//
// Prefer RunProviderAuthCommand when the caller has a real bidi transport
// (Node/Electron main process): it is one call with no server-side session to
// leak. Use these when the caller is a browser.
// ---------------------------------------------------------------------------

message StartProviderAuthSessionRequest {
  LlmProviderType provider_type = 1;
  // Optional CLI binary override (falls back to PATH / discovery).
  optional string binary = 2;
  // Optional CLAUDE_CONFIG_DIR-style config directory. Pass the SAME value the
  // provider uses, and the same one given to CheckProviderConnection --
  // credentials are written per config directory, so signing in with one and
  // checking another silently does nothing.
  optional string config_dir = 3;
  uint32 cols = 4;
  uint32 rows = 5;
}

message StartProviderAuthSessionResponse {
  // Opaque id for the other three calls.
  string session_id = 1;
}

message StreamProviderAuthOutputRequest {
  string session_id = 1;
  // Replay output already produced before this stream attached.
  //
  // Default (false) loses whatever the CLI printed between StartProviderAuth-
  // Session returning and the stream connecting -- which, for a login flow,
  // is usually the URL the user has to visit. Set true unless you are
  // deliberately resuming and already rendered the earlier bytes.
  bool replay = 2;
}

message SendProviderAuthInputRequest {
  string session_id = 1;
  oneof frame {
    // Raw bytes typed by the user, written to the PTY's stdin.
    bytes stdin = 2;
    ProviderAuthCommandResize resize = 3;
  }
}

message SendProviderAuthInputResponse {}

message EndProviderAuthSessionRequest {
  string session_id = 1;
}

message EndProviderAuthSessionResponse {
  // Exit code, when the process had already exited on its own.
  int32 exit_code = 1;
  // False when the process was still running and had to be killed.
  bool exited = 2;
}

message ProviderAuthCommandInput {
  oneof frame {
    ProviderAuthCommandStart start = 1;
    // Raw bytes typed by the user, written to the PTY's stdin.
    bytes stdin = 2;
    ProviderAuthCommandResize resize = 3;
  }
}

message ProviderAuthCommandOutput {
  oneof frame {
    // Combined PTY output (stdout+stderr are not distinguishable once behind a PTY).
    bytes output = 1;
    // Sent once, after the process exits; the stream closes immediately after.
    int32 exit_code = 2;
    // Sent once a process has been started successfully.
    bool started = 3;
  }
}

// --- Embedding providers (typed, per-kind config — mirrors RegisterLlmProviderRequest) ---

message UserOllamaEmbeddingConfig {
  string base_url = 1;
  string embed_model = 2;
  int32 dimensions = 3;
}

message UserOpenAiCompatEmbeddingConfig {
  string base_url = 1;
  optional string api_key = 2;
  string embed_model = 3;
  int32 dimensions = 4;
}

message UserBedrockEmbeddingConfig {
  string region = 1;
  optional string profile = 2;
  string embed_model = 3;
  int32 dimensions = 4;
  optional string endpoint_url = 5;
}

message RegisterUserEmbeddingProviderRequest {
  string provider_id = 1;
  oneof config {
    UserOllamaEmbeddingConfig ollama = 2;
    UserOpenAiCompatEmbeddingConfig openai_compat = 3;
    UserBedrockEmbeddingConfig bedrock = 4;
  }
}

message RegisterUserEmbeddingProviderResponse {}

message UnregisterUserEmbeddingProviderRequest {
  string provider_id = 1;
}

message UnregisterUserEmbeddingProviderResponse {}

message ListEmbeddingProvidersRequest {}

message ListEmbeddingProvidersResponse {
  repeated string provider_ids = 1;
}

// Token usage on assistant_turn_finished (optional).
message TokenUsage {
  optional int64 input_tokens = 1;
  optional int64 output_tokens = 2;
  optional int64 cache_read_tokens = 3;
  optional int64 cache_write_tokens = 4;
  optional double total_cost_usd = 5;
  // Tokens the model spent on reasoning / thinking (a subset of output on most providers).
  optional int64 reasoning_tokens = 6;
}

// How QueryUsage returns results.
enum UsageGroupBy {
  USAGE_GROUP_BY_UNSPECIFIED = 0;
  // Individual usage rows (one per recorded call).
  USAGE_GROUP_BY_ROWS = 1;
  // Totals per (tenant, scope, model).
  USAGE_GROUP_BY_AGGREGATE = 2;
}

// Query token usage filtered by tenant, scope and model over a time range.
message QueryUsageRequest {
  // Empty = no filter on the field.
  string tenant_id = 1;
  string scope_id = 2;
  string model = 3;
  // Inclusive start / exclusive end, Unix epoch seconds; unset = unbounded.
  optional int64 since_unix = 4;
  optional int64 until_unix = 5;
  UsageGroupBy group_by = 6;
}

// One recorded call's usage.
message UsageRow {
  string tenant_id = 1;
  string scope_id = 2;
  string model = 3;
  int64 recorded_unix = 4;
  int64 input_tokens = 5;
  int64 output_tokens = 6;
  int64 cache_read_tokens = 7;
  int64 cache_write_tokens = 8;
  int64 reasoning_tokens = 9;
  double cost_usd = 10;
}

// Summed usage for one (tenant, scope, model).
message UsageTotal {
  string tenant_id = 1;
  string scope_id = 2;
  string model = 3;
  int64 input_tokens = 4;
  int64 output_tokens = 5;
  int64 cache_read_tokens = 6;
  int64 cache_write_tokens = 7;
  int64 reasoning_tokens = 8;
  double cost_usd = 9;
  int64 call_count = 10;
}

message QueryUsageResponse {
  // Populated when group_by = ROWS.
  repeated UsageRow rows = 1;
  // Populated when group_by = AGGREGATE.
  repeated UsageTotal totals = 2;
}

message QueryToolUsageRequest {
  int64 since_unix = 1;
  int64 until_unix = 2;
  // Optional; a scoped caller is always forced to its own scope.
  optional string scope_id = 3;
  // Optional; must match the caller's tenant when set.
  string tenant_id = 4;
}

// Per-tool call, error and duration (ms) statistics over the window.
message ToolUsageStat {
  string tool_name = 1;
  int64 calls = 2;
  int64 errors = 3;
  int64 min_ms = 4;
  double median_ms = 5;
  double mean_ms = 6;
  int64 max_ms = 7;
}

message QueryToolUsageResponse {
  repeated ToolUsageStat stats = 1;
}

// --- Conversation stream frames (wire shape mirrors TS ConversationEvent) ---

message EvUserTurnCommitted {
  string user_message_id = 1;
  optional string text_preview = 2;
  // Server wall-clock time (ms since epoch) the user turn started. Clients time
  // the running turn from this rather than from when they happened to see it,
  // so the clock survives reloads, rejoins and switching between sessions.
  optional int64 committed_at_ms = 3;
}

message EvAssistantTurnStarted {
  string turn_id = 1;
  optional bool thinking_enabled = 2;
  optional bool streaming_tool_calls = 3;
  optional string parent_turn_group_id = 4;
  optional int64 turn_seq = 5;
}

message EvAssistantThinkingDelta {
  string turn_id = 1;
  string delta = 2;
}

// User-facing activity headline (not chain-of-thought). Each frame is a full snapshot for the turn;
// clients replace any prior headline for that turn_id (UI "current status" line).
message EvAssistantActivitySnapshot {
  string turn_id = 1;
  string headline = 2;
}

message EvAssistantTextDelta {
  string turn_id = 1;
  string delta = 2;
}

message EvToolCallStreamStarted {
  string turn_id = 1;
  string id = 2;
  optional string name = 3;
}

message EvToolCallArgsDelta {
  string turn_id = 1;
  string id = 2;
  string args_delta = 3;
}

message EvToolCallStreamFinished {
  string turn_id = 1;
  string id = 2;
  string name = 3;
  string arguments_json = 4;
}

message EvToolExecutionStarted {
  string turn_id = 1;
  string tool_call_id = 2;
  string name = 3;
  // When set, execution is delegate_to_client; client must call SubmitToolResults with this nonce.
  optional string client_wait_nonce = 4;
  // The arguments this tool was invoked with, as a JSON object, so a UI can
  // render what the call is actually DOING ("Reading lines 15-200 of foo.go")
  // rather than just the tool name.
  //
  // Set on every transport. It matters most for MCP-dispatched tools (Claude
  // Code / Cursor CLI): their model-side tool call happens inside the CLI, so
  // llmd never emits EvToolCallStreamFinished for them and this is the ONLY
  // frame carrying their arguments. Native backends also populate it so a UI
  // has one field to read regardless of provider.
  //
  // May be shortened — see arguments_truncated. Never contains secrets beyond
  // whatever the caller put in the tool arguments themselves.
  optional string arguments_json = 5;
  // True when llmd shortened the arguments to bound the event log. Oversized
  // VALUES are elided (a file body becomes a short marker) while every key and
  // small scalar is kept, so the result is still parseable JSON and still
  // carries the identifying fields a label is built from. Treat it as display
  // material: anything needing exact arguments reads the tool call from
  // session history.
  optional bool arguments_truncated = 6;
}

message EvToolExecutionFinished {
  string turn_id = 1;
  string tool_call_id = 2;
  string name = 3;
  bool success = 4;
  optional string error_message = 5;
}

message EvAssistantTurnFinished {
  string turn_id = 1;
  optional string assistant_message_id = 2;
  optional string finish_reason = 3;
  TokenUsage usage = 4;
  // Wall time, in ms, of the model call that produced assistant_message_id.
  // Unset when it was not measured.
  optional int64 model_duration_ms = 5;
}

message EvAssistantTurnFailed {
  string turn_id = 1;
  string error = 2;
}

message EvConversationAborted {
  optional string reason = 1;
}

// Agent-authored status headline (set_status tool). Distinct from
// EvAssistantActivitySnapshot: that one is provider-extracted chain-of-
// thought summarization tied to a turn_id; this one is an explicit,
// model-issued "here's what I'm doing" string, scoped to the session rather
// than any single turn (it can be emitted by MCP-driven agentic CLIs that
// have no ChatStream turn at all).
message EvSessionStatus {
  string session_id = 1;
  string headline = 2;
}

// Session title set via the set_session_title tool (agent-authored, distinct
// from the client/UI-authored SessionMeta.title write path via
// SetSessionMeta).
message EvSessionTitleChanged {
  string session_id = 1;
  string title = 2;
}

// Session todo list changed via add_todo/update_todo (agent-authored).
// todos_json is the same encoding SessionMeta.todos_json / llmd_sessions.todos_json
// persist (see store.TodoItem): a JSON array of {id, description, status,
// created_turn_seq, started_turn_seq, completed_turn_seq}.
message EvTodosUpdated {
  string session_id = 1;
  string todos_json = 2;
}

// One user message waiting its turn on a session.
message QueuedMessage {
  // Queue entry id — what remove/reorder address. NOT a message id: the message
  // id is minted only when the entry is finally sent as a turn.
  string id = 1;
  string content = 2;
  // "pending" or "running". Running means some drainer has claimed it.
  string state = 3;
  // Identifies the drainer running this entry; empty while pending.
  string claim_owner = 4;
  // Unix seconds at which the claim stops being believed, so a UI can show a
  // stalled entry rather than one eternally in progress. Unset while pending.
  optional int64 claim_expires_at_unix = 5;
  int64 created_at_unix = 6;
  // Attachments the message will carry when it is sent as a turn. Persisted
  // anchored to the user message the entry becomes; provider-facing `content`
  // is spliced into that message at send time.
  repeated MessageAttachment attachments = 7;
  // How the turn this entry becomes must run (e.g. tools disabled).
  TurnOptions turn_options = 8;
}

// Per-turn behavior switches carried from a queued message (or a direct
// ChatStream call) onto the turn it starts.
message TurnOptions {
  // No tools this turn: none are offered to the provider (API or MCP), and any
  // tool call the model makes anyway is refused and ends the turn. For
  // informational messages (ask-card answers, notifications) that should get a
  // reply, not a run of further work.
  bool disable_tools = 1;
  // ChatStream only: let llmd decide whether this message runs now or waits.
  // It runs now only when the session is idle (no turn running), its queue is
  // empty and not paused; otherwise llmd appends it to the session queue and
  // the stream carries a single EvTurnQueued frame instead of a turn. The
  // decision is atomic with taking the session, so a message sent in the gap
  // between one turn ending and the next queued one starting never jumps the
  // queue. Ignored on queued entries.
  bool queue_if_busy = 2;
}

// ChatStream with turn_options.queue_if_busy found the session busy and put
// the message in the session queue rather than running it. The stream ends
// after this frame.
message EvTurnQueued {
  string session_id = 1;
  QueuedMessage entry = 2;
}

// A session's message queue changed: enqueued, removed, reordered, claimed,
// retired, paused or resumed. Carries the whole queue rather than a delta — the
// queue is short, several clients may be editing it at once, and a full snapshot
// means a window that missed an event still converges instead of drifting.
message EvQueueChanged {
  string session_id = 1;
  repeated QueuedMessage queue = 2;
  bool paused = 3;
}

// A session attachment (e.g. an ask_card) was created or updated — by an agent
// tool (ask_user) or by any client via UpsertSessionAttachment. Carries the full
// attachment so a live client can render/update it without a refetch.
message EvAttachmentUpserted {
  string session_id = 1;
  string attachment_id = 2;
  string kind = 3;
  // Message the attachment hangs off; may be empty or unresolved for
  // tool-created cards (render those as anchorless).
  string message_id = 4;
  string after_tool_call_id = 5;
  string payload_json = 6;
}

// A session attachment was removed via DeleteSessionAttachment.
message EvAttachmentDeleted {
  string session_id = 1;
  string attachment_id = 2;
}

// One streamed observation for the client. schema_version matches TS CONVERSATION_EVENT_SCHEMA_VERSION.
message ConversationStreamFrame {
  int32 schema_version = 1;
  oneof frame {
    EvUserTurnCommitted user_turn_committed = 2;
    EvAssistantTurnStarted assistant_turn_started = 3;
    EvAssistantThinkingDelta assistant_thinking_delta = 4;
    EvAssistantTextDelta assistant_text_delta = 5;
    EvToolCallStreamStarted tool_call_stream_started = 6;
    EvToolCallArgsDelta tool_call_args_delta = 7;
    EvToolCallStreamFinished tool_call_stream_finished = 8;
    EvToolExecutionStarted tool_execution_started = 9;
    EvToolExecutionFinished tool_execution_finished = 10;
    EvAssistantTurnFinished assistant_turn_finished = 11;
    EvAssistantTurnFailed assistant_turn_failed = 12;
    EvConversationAborted conversation_aborted = 13;
    // Final assembled reply for this stream (sent after assistant_turn_finished).
    AssistantReply stream_complete = 14;
    EvAssistantActivitySnapshot assistant_activity_snapshot = 15;
    EvSessionStatus session_status = 16;
    EvSessionTitleChanged session_title_changed = 17;
    EvTodosUpdated todos_updated = 18;
    EvQueueChanged queue_changed = 19;
    EvAttachmentUpserted attachment_upserted = 20;
    EvAttachmentDeleted attachment_deleted = 21;
    EvTurnQueued turn_queued = 22;
  }
}

// --- Per-session composer draft ---------------------------------------------
//
// A draft is the single unsent message currently typed into a session's
// composer. It exists so a reload, a crash or a closed laptop does not lose it.
// One per session by definition; it is never history and the model never sees it.

message UpsertSessionDraftRequest {
  string session_id = 1;
  // Blank content clears the draft: "the composer is empty" and "there is no
  // draft" are the same state.
  string content = 2;
}
message UpsertSessionDraftResponse {}

message GetSessionDraftRequest {
  string session_id = 1;
}
message GetSessionDraftResponse {
  // Empty when the session has no draft.
  string content = 1;
}

message ClearSessionDraftRequest {
  string session_id = 1;
}
message ClearSessionDraftResponse {}

// --- Per-session message queue ---------------------------------------------
//
// llmd owns the queue but never drains it. Drainers are ordinary clients — a
// background daemon, or a UI while it is open — and several can be alive at
// once, so llmd's job is the state plus the guarantees that make competing
// drainers safe: claims are atomic and expire, pause is enforced here rather
// than trusted to callers, and an entry that already started a turn is never
// handed out twice.

message EnqueueMessageRequest {
  string session_id = 1;
  // Required unless attachments is non-empty.
  string content = 2;
  repeated MessageAttachment attachments = 3;
  // Applied to the turn this entry starts when it is sent.
  TurnOptions turn_options = 4;
}
message EnqueueMessageResponse {
  QueuedMessage entry = 1;
}

// Answers an agent ask card (one created by the ask_user tool).
//
// First answer: queued at the FRONT of the session queue as a user message
// "Answer to: <card title>" carrying the ask_card_response attachment, so the
// agent resumes on it (pause still applies; the entry can be reordered or
// removed like any other). Re-answer while still queued: the queued entry's
// attachment is replaced. Re-answer after it was sent: the persisted answer is
// updated in place and no new turn starts.
//
// By default the queued answer carries turn_options.disable_tools ("answer and
// stop": the agent replies but runs no tools). Set continue_with_tools to let
// the answer's turn use tools ("answer and continue"). Only the first answer's
// choice applies; a re-answer keeps the existing entry's turn options.
message AnswerAskCardRequest {
  string session_id = 1;
  string card_id = 2;
  // JSON-encoded AskCardResponse (packages/core/src/askCard.ts); its cardId
  // must equal card_id. The provider-facing summary is built server-side.
  string response_json = 3;
  // When true, the answer's turn runs with tools enabled so the agent can
  // carry on working. Default false: tools disabled on the answer's turn.
  bool continue_with_tools = 4;
}
message AnswerAskCardResponse {
  // The queued entry carrying the answer; unset when an already-sent answer
  // was updated in place.
  optional QueuedMessage entry = 1;
  // True when this replaced an earlier answer (queued or sent).
  bool updated_existing = 2;
}

// An agent ask card (ask_user) still waiting on the user: status "pending",
// no answer recorded yet. Found across sessions, so a host can surface every
// open question in one place without watching each session.
message OpenAskCard {
  string scope_id = 1;
  string session_id = 2;
  string card_id = 3;
  // The card's payload as stored (packages/core/src/askCard.ts AskCard).
  string payload_json = 4;
  int64 created_at_ms = 5;
}

// Tenant from llmd-tenant-id; llmd-scope-id narrows to one scope, absent =
// every scope of the tenant.
message ListOpenAskCardsRequest {}
message ListOpenAskCardsResponse {
  // Oldest first.
  repeated OpenAskCard cards = 1;
}

// Same scoping as ListOpenAskCardsRequest.
message SubscribeAskCardsRequest {}

// One ask card's state after a change. open=true carries the card as it is
// now; open=false means it no longer waits (answered, dismissed or deleted)
// and only the ids are set. Changes are notifications: a subscriber that
// (re)connects lists first and then applies changes, so a missed one is
// repaired by the next list.
message AskCardChange {
  OpenAskCard card = 1;
  bool open = 2;
}

message ListQueueRequest {
  string session_id = 1;
}
message ListQueueResponse {
  repeated QueuedMessage queue = 1;
  bool paused = 2;
}

message RemoveQueuedMessageRequest {
  string session_id = 1;
  string entry_id = 2;
}
message RemoveQueuedMessageResponse {
  // False when the entry was already gone (ran, or removed by another window).
  bool removed = 1;
}

message ReorderQueueRequest {
  string session_id = 1;
  // The full desired order. Unknown ids are ignored; entries not listed keep
  // their relative order after the listed ones, so a stale UI can never drop
  // queued work by omitting it.
  repeated string entry_ids = 2;
}
message ReorderQueueResponse {
  repeated QueuedMessage queue = 1;
}

message SetQueuePausedRequest {
  string session_id = 1;
  bool paused = 2;
}
message SetQueuePausedResponse {}

message ClaimNextQueuedMessageRequest {
  string session_id = 1;
  // Identifies this drainer, so its claim can be distinguished from another's.
  // Stable for the life of the drainer (e.g. a per-process uuid).
  string owner = 2;
}
message ClaimNextQueuedMessageResponse {
  // Unset when there is nothing to claim: the queue is empty, or its head is
  // already running under a live claim.
  QueuedMessage entry = 1;
  // True when nothing was claimed because the queue is paused. Distinct from an
  // empty queue: a drainer must keep polling rather than conclude it is done.
  bool paused = 2;
}

message HeartbeatQueuedMessageRequest {
  string session_id = 1;
  string entry_id = 2;
  string owner = 3;
}
message HeartbeatQueuedMessageResponse {}

// MarkQueuedMessageStarted records the turn a claimed entry produced, and is
// what makes delivery at-most-once. Call it as soon as the turn id is known,
// BEFORE the turn completes: if the drainer then dies, whoever reclaims can see
// the message was already sent and retire it instead of sending it twice.
message MarkQueuedMessageStartedRequest {
  string session_id = 1;
  string entry_id = 2;
  string owner = 3;
  string turn_id = 4;
}
message MarkQueuedMessageStartedResponse {}

message RetireQueuedMessageRequest {
  string session_id = 1;
  string entry_id = 2;
  string owner = 3;
}
message RetireQueuedMessageResponse {}

// ReleaseQueuedMessage hands a claimed entry back without running it, keeping
// its position — for a drainer shutting down cleanly, rather than letting its
// lease lapse and stalling the queue until it does.
message ReleaseQueuedMessageRequest {
  string session_id = 1;
  string entry_id = 2;
  string owner = 3;
}
message ReleaseQueuedMessageResponse {}

message ChatStreamRequest {
  repeated Message messages = 1;
  CallOptions options = 2;
  // Session key for durable chat state in llmd. Required: ChatStream rejects an empty or unset session_id.
  // For stateless calls without a session, use Complete or CompleteStream instead.
  // Turns are persisted (if a store exists), GetSessionHistory applies, and prior messages may be
  // prepended from the session store when prior turns exist; stateful providers also use llmd_provider_session_sync
  // for Cursor --resume and incremental delivery when the DB repo is configured.
  optional string session_id = 3;
  // Ignored: llmd always persists this turn to the session store when session_id is set (and a store exists).
  bool persist_session = 4;
  // Structured system prompt sections (client-authored). When set, llmd renders provider-specific
  // prompt body and MDC files from these sections instead of trusting flat system message content alone.
  repeated SystemPromptSection system_prompt_sections = 6;
  // Documents in scope for this turn (open plan/design/idea, etc.). the client sends the
  // full current body each turn; llmd dedups by content hash and injects full-on-first /
  // full-on-change / omit-when-unchanged into the outbound model messages. The persisted
  // user content is never mutated by this.
  repeated TrackedDocument tracked_documents = 7;
  // First-turn-only session context block (graph seed, neighborhood overview). Persisted
  // once on the session and injected — frozen — as the lead context on the first outbound
  // model message. Ignored on non-first turns. Never merged into persisted user content.
  optional string initial_seed = 8;
  // Repo-relative paths the initial seed surfaced (neighborhood seed matched files +
  // entry points). Folded once into the session graph-usage accumulator alongside the
  // write-once initial_seed persist, so a later act on a seeded path earns a tier "seed"
  // attribution. Ignored when initial_seed is absent/already persisted.
  repeated string initial_seed_graph_paths = 9;
  // Per-turn switches (e.g. disable_tools). The queue drainer copies a queued
  // entry's turn_options here.
  TurnOptions turn_options = 10;
  // Per-turn key/value context passed unchanged to every tool call in the turn
  // (ExecutorToolCall.tool_context). When unset or empty, the session's
  // EnsureSessionRequest.tool_context map is used instead.
  map<string, string> tool_context = 11;
}

// One logical block of the assistant system prompt (stable id + provider-neutral content).
message SystemPromptSection {
  string id = 1;
  string content = 2;
  repeated string tags = 3;
}

// Delivers the result for one client-delegated tool wait (see EvToolExecutionStarted.client_wait_nonce).
message SubmitToolResultsRequest {
  optional string session_id = 1;
  string client_wait_nonce = 2;
  string tool_call_id = 3;
  string content = 4;
  bool is_error = 5;
  // When true (and is_error is false), the agent loop finishes the current
  // round of tool calls and then ends the turn instead of re-querying the
  // model — e.g. a tool that proposes a change and waits for user approval.
  // Ignored on error results.
  bool ends_turn = 6;
}

message SubmitToolResultsResponse {}

// ---------------------------------------------------------------------------
// Token accounting and tool result expansion
// ---------------------------------------------------------------------------

message GetSessionTokenUsageRequest {
  string session_id = 1;
}

message GetSessionTokenUsageResponse {
  int64 total_provider_in_toks = 1;
  int64 total_provider_out_toks = 2;
  int64 total_original_tokens = 3;
  int64 total_compressed_tokens = 4;
}

// One passive, out-of-band decoration attached to a turn or a single tool
// result: an opaque kind+uri pointer, never interpreted by llmd (see
// ToolResultAttachment). Decorations never appear in message content; clients
// join them onto the transcript by turn_seq (turn-level) or tool_call_id
// (result-level) and resolve uri against whatever system emitted it.
message TurnDecoration {
  // Canonical llmd_session_turns.turn_seq; 0 when unknown.
  int64 turn_seq = 1;
  // Legacy/external turn id ("" for MCP-authored rows).
  string turn_id = 2;
  // "turn" or "tool_result".
  string target = 3;
  // Set when target == "tool_result".
  string tool_call_id = 4;
  // Decoration type discriminator (e.g. "host_provenance", "entity_reference").
  string kind = 5;
  // Opaque pointer to the emitter-owned data this decoration references.
  string uri = 6;
  int64 created_at_unix = 8;
}

message ListTurnDecorationsRequest {
  string session_id = 1;
}

message ListTurnDecorationsResponse {
  // Insertion order (replayable in turn order via turn_seq).
  repeated TurnDecoration decorations = 1;
}

// Per-turn token usage entry keyed by the persisted assistant message id.
message TurnUsageEntry {
  string message_id = 1;
  int64 input_tokens = 2;
  int64 output_tokens = 3;
  int64 cache_read_tokens = 4;
  int64 cache_write_tokens = 5;
  // Compression accounting: populated when tool-result compression fired during
  // this turn. original_tokens is the pre-compression count; compressed_tokens
  // is the wire count actually sent. Both are 0 when no compression occurred.
  int64 original_tokens = 6;
  int64 compressed_tokens = 7;
  // Canonical llmd_session_turns.turn_seq for this turn's message (from
  // llmd_chat_messages.turn_seq); 0 when unknown. Lets clients join turn-level
  // graph decorations (keyed by turn_seq) onto the same bubble as the tokens.
  int64 turn_seq = 8;
  // Wall time, in ms, of the model call that produced this message; 0 when unknown.
  int64 model_duration_ms = 9;
}

message GetSessionTurnBreakdownRequest {
  string session_id = 1;
}

message GetSessionTurnBreakdownResponse {
  repeated TurnUsageEntry turns = 1;
  // total_input_tokens is the combined new + cache_read + cache_write total.
  int64 total_input_tokens = 2;
  int64 total_output_tokens = 3;
  int64 total_cache_read_tokens = 4;
  int64 total_cache_write_tokens = 5;
}

// Aggregated token metrics for the calling scope.
// When all_scopes is true the response sums across every scope in the caller's
// tenant (overview surfaces only) instead of just the caller's scope.
message GetScopeTokenMetricsRequest {
  bool all_scopes = 1;
}

message GetScopeTokenMetricsResponse {
  int64 total_provider_in_toks = 1;
  int64 total_provider_out_toks = 2;
  // Input-side compression: original (pre) vs compressed wire (post) tokens.
  int64 total_original_tokens = 3;
  int64 total_compressed_tokens = 4;
  int64 compressed_result_count = 5;
  // Provider cache accounting (measured): tokens served from / written to cache.
  int64 total_cache_read_toks = 6;
  int64 total_cache_write_toks = 7;
}

// One hourly bucket of actual provider token usage (measured spend). The client
// re-aggregates these into coarser buckets (6h/day/week) based on the span.
message TokenUsageBucket {
  // Unix epoch seconds at the UTC hour start of the bucket.
  int64 bucket_unix = 1;
  int64 provider_in_toks = 2;
  int64 provider_out_toks = 3;
  int64 cache_read_toks = 4;
  int64 cache_write_toks = 5;
}

message GetTokenUsageTimelineRequest {
  bool all_scopes = 1;
}

message GetTokenUsageTimelineResponse {
  repeated TokenUsageBucket buckets = 1;
}

// One daily bucket of input-side compression savings.
message TokenSavingsBucket {
  // Unix epoch seconds at UTC midnight of the bucket day.
  int64 day_unix = 1;
  int64 original_tokens = 2;   // what would have been sent (pre-compression)
  int64 compressed_tokens = 3; // what was actually sent (post-compression)
}

message GetTokenSavingsTimelineRequest {
  bool all_scopes = 1;
}

message GetTokenSavingsTimelineResponse {
  repeated TokenSavingsBucket buckets = 1;
}

message GetToolResultOriginalRequest {
  string tool_call_id = 1;
  optional string session_id = 2;
}

message GetToolResultOriginalResponse {
  string original_content = 1;
  bool found = 2;
}

message UpdateSessionCompressionSettingsRequest {
  string session_id = 1;
  // Master switch: false = compression disabled for this session regardless of
  // the mechanism flags below (which are still persisted so they survive a toggle).
  optional bool enabled = 2;
  // Threshold: token count above which to compress (default 2000)
  optional int64 threshold = 3;
  // Aging: keep this many most-recent tool results in full; older ones collapse
  // to expandable stale references. 0 = aging disabled. Absent = default (6).
  optional int64 age_keep = 4;
  // When true, large `search` tool results are summarized via extractive
  // selection. Absent = leave unchanged.
  optional bool extractive_search = 5;
  // Lossless minify + dedup of tool results. Absent = leave unchanged.
  optional bool minify_dedup = 6;
}

message UpdateSessionCompressionSettingsResponse {
  bool success = 1;
  optional bool enabled = 2;
  optional int64 threshold = 3;
  optional int64 age_keep = 4;
  optional bool extractive_search = 5;
  optional bool minify_dedup = 6;
}

// ---------------------------------------------------------------------------
// Session metadata (Tier 2: session-scoped state)
// ---------------------------------------------------------------------------

message TodoItem {
  string id = 1;
  string title = 2;
  optional int64 completed_at = 3;
}

message SessionMeta {
  string title = 1;
  string todos_json = 2;
  string attributes_json = 3;
  int64 cursor_pos = 4;
  string session_id = 5;
  string chat_surface = 6;
  int64 created_at = 7;  // unix millis
  int64 updated_at = 8;  // unix millis
  // Per-session model selection, owned by UpdateSessionLlm (never written via
  // SetSessionMeta). Surfaced here read-only so the client can rehydrate the
  // session's provider/model after a restart.
  string provider_id = 9;
  string default_model = 10;
  // Arbitrary caller-defined k/v labels. Read-only here: SetSessionMeta IGNORES
  // this field, because a meta write is wholesale and would silently drop tags
  // set by another caller. Use UpdateSessionTags (merge) or
  // ReplaceSessionTags (wholesale, explicit) to write them.
  map<string, string> tags = 11;
  // Fork lineage (see ForkSession). Read-only: SetSessionMeta IGNORES these.
  // Informational labels only — a fork owns a full copy of its data, and the
  // source may since have been deleted. Empty when the session was not forked;
  // forked_from_message_id is also empty when the whole history was cloned.
  string forked_from_session_id = 12;
  string forked_from_message_id = 13;
  // The current turn's agent-authored status headline (set_status). Read-only:
  // SetSessionMeta IGNORES it. Turn-scoped: llmd clears it when a user turn
  // starts, so it is empty until the running (or last) turn sets one. A client
  // seeds its status from this on (re)connect; EvSessionStatus updates it live.
  string status = 14;
}

// SessionSummary is the lightweight per-session row returned by ListSessions:
// enough to render the session list (id, title, surface, recency) without
// fetching transcripts.
message SessionSummary {
  string session_id = 1;
  string title = 2;
  string chat_surface = 3;
  int64 created_at = 4;  // unix millis
  int64 updated_at = 5;  // unix millis
  int64 cursor_pos = 6;
  // Unix millis of the newest persisted chat message in this session, derived
  // from MAX(llmd_chat_messages.created_at) — NOT a stored column. 0 when the
  // session has no messages yet.
  //
  // This is deliberately distinct from updated_at: updated_at is bumped by any
  // session mutation (title edit, cursor advance, compression settings), so it
  // answers "last touched", while last_message_at answers "last said something",
  // which is what a recency-ordered session list actually wants.
  int64 last_message_at = 7;
  // Arbitrary caller-defined k/v labels (see ListSessionsRequest.tag_filters).
  map<string, string> tags = 8;
  // Fork lineage; see SessionMeta.forked_from_session_id.
  string forked_from_session_id = 9;
  string forked_from_message_id = 10;
}

// Sort key for ListSessions.
enum SessionSortField {
  // Defaults to SESSION_SORT_FIELD_LAST_MESSAGE_AT.
  SESSION_SORT_FIELD_UNSPECIFIED = 0;
  // Newest chat message first. Sessions with no messages fall back to their
  // created_at for ordering purposes (their last_message_at is still 0).
  SESSION_SORT_FIELD_LAST_MESSAGE_AT = 1;
  SESSION_SORT_FIELD_CREATED_AT = 2;
  // Last mutation of any kind (see SessionSummary.last_message_at).
  SESSION_SORT_FIELD_UPDATED_AT = 3;
  // Case-insensitive title order; defaults to ascending.
  SESSION_SORT_FIELD_TITLE = 4;
}

enum SessionSortOrder {
  // Descending for the timestamp fields, ascending for TITLE.
  SESSION_SORT_ORDER_UNSPECIFIED = 0;
  SESSION_SORT_ORDER_ASC = 1;
  SESSION_SORT_ORDER_DESC = 2;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  SessionMeta meta = 1;
}

message SetSessionMetaRequest {
  string session_id = 1;
  SessionMeta meta = 2;
}

message SetSessionMetaResponse {
  bool success = 1;
}

message ListSessionsRequest {
  // Defaults to last-message-first (see SessionSortField).
  SessionSortField sort_by = 1;
  SessionSortOrder order = 2;
  // Max rows to return. 0 → 50. Values above 500 are clamped to 500 rather
  // than rejected, so a client asking for "everything" gets a capped page plus
  // has_more instead of an error.
  int32 page_size = 3;
  // Rows to skip. Offset paging (not a keyset cursor) because the sort key is
  // caller-selectable and one of them (last_message_at) is derived, so there is
  // no single stable column to seek on.
  int32 offset = 4;
  // Optional exact-match filter on SessionSummary.chat_surface (build, ask,
  // debug, doc, pair). Empty = all surfaces.
  string chat_surface = 5;
  // Optional tag filter: a session must carry ALL of these tags to match (AND).
  // A value of "" matches on key presence with any value.
  //
  // Unlike chat_surface, this is NOT index-backed — it scans the scope's
  // sessions. That is a deliberate tradeoff (tag filtering is rare next to
  // surface filtering); combine it with chat_surface when you can, so the
  // indexed predicate narrows the set first.
  map<string, string> tag_filters = 6;
}

message ListSessionsResponse {
  // One page of session rows in the requested order (default: newest message first).
  repeated SessionSummary sessions = 1;
  // Total rows matching chat_surface, ignoring page_size/offset.
  int64 total_count = 2;
  // offset + len(sessions), valid as the next request's offset. 0 when has_more is false.
  int32 next_offset = 3;
  bool has_more = 4;
}

// UpdateSessionTags merges tags into a session, leaving unmentioned keys alone.
// A key whose value is "" is DELETED. Merge rather than replace so a caller
// setting one tag cannot clobber tags it never knew about; set replace = true
// for wholesale "these tags and no others" semantics.
message UpdateSessionTagsRequest {
  string session_id = 1;
  map<string, string> tags = 2;
  // When true, tags not present in `tags` are removed. Empty-valued keys are
  // simply absent from the result rather than acting as deletes.
  bool replace = 3;
}

message UpdateSessionTagsResponse {
  // The session's tags after the update.
  map<string, string> tags = 1;
}

message GetStorageStatsRequest {
  int32 largest_sessions_limit = 1;
}

message StorageTableStat {
  string name = 1;
  int64 bytes = 2; // table including its indexes
}

message StorageSessionStat {
  string session_id = 1;
  string title = 2;
  string chat_surface = 3;
  int64 message_count = 4;
  int64 bytes = 5;
  int64 last_message_unix_ms = 6;
  string scope_id = 7; // empty for the global scope
}

message GetStorageStatsResponse {
  int64 database_bytes = 1;
  int64 free_bytes = 2; // freelist pages, reclaimable by VACUUM
  repeated StorageTableStat tables = 3;
  int64 session_count = 4;
  repeated StorageSessionStat largest_sessions = 5;
}

message DeleteSessionsRequest {
  repeated string session_ids = 1;
}

message DeleteSessionsResponse {
  int32 deleted = 1;
}

message CompactRequest {}

message CompactResponse {
  string run_id = 1;
  int64 bytes_before = 2;
  int64 bytes_after = 3;
  int64 events_removed = 4;
}

message DeleteSessionRequest {
  string session_id = 1;
}

message DeleteSessionResponse {
  bool success = 1;
}

// ForkSession clones a session into a new, fully independent session (no data
// is shared with or read through to the source). The clone is inclusive of
// up_to_message_id and extends to just before the next user/assistant message,
// so an assistant message's tool results always come with it. Empty
// up_to_message_id clones the whole history.
//
// Copied: session settings (provider/model, tools, prompt sections, tool policy,
// compression, tags, surface, title) and the history plus its per-turn data
// (turn metadata, tool-result sidecars, decorations, tracked-document versions).
// Not copied: provider-side session state — the fork's first turn replays its
// history as a fresh provider session, exactly like a provider/model switch —
// nor the event log, cache, draft or queue.
//
// Errors: NOT_FOUND (unknown source or message), ALREADY_EXISTS (new_session_id
// taken), FAILED_PRECONDITION (the cloned range reaches into a turn that is
// still running — fork from an earlier message or wait for the turn to finish).
message ForkSessionRequest {
  string source_session_id = 1;
  // Inclusive cutoff. Empty = clone the full history.
  string up_to_message_id = 2;
  // Optional id for the fork; the server mints one when empty.
  string new_session_id = 3;
  // Optional title override; defaults to the source session's title.
  string title = 4;
}

message ForkSessionResponse {
  string session_id = 1;
  // Distinct messages copied (an assistant message spans several stored rows).
  int32 copied_messages = 2;
}

message SetSessionCursorRequest {
  string session_id = 1;
  int64 cursor_pos = 2;
}

message SetSessionCursorResponse {
  bool success = 1;
}

message AdvanceSessionCursorRequest {
  string session_id = 1;
  int64 delta = 2;
}

message AdvanceSessionCursorResponse {
  int64 new_cursor_pos = 1;
}

// ---------------------------------------------------------------------------
// Remote tool execution: ToolProviderService.Connect
// ---------------------------------------------------------------------------
// The full protocol description lives on ToolProviderToServer (attached there
// so it appears in generated docs, e.g. `go doc llmv1.ToolProviderToServer`).

// Legacy first frame (see ToolProviderToServer): registers this stream as
// the delegate_to_client transport for the request's (tenant, scope).
message ToolProviderHello {
  // Free-form provider label. llmd does not currently use it for routing,
  // which is keyed only by (tenant, scope) from request metadata.
  string provider_id = 1;
  // Tenant and scope come from request metadata (llmd-tenant-id / llmd-scope-id).
  // Must equal the shared secret configured on llmd
  // (llmdhost.Config.ToolProviderSecret); with none configured every hello is refused.
  optional string shared_secret = 3;
}

// Legacy: llmd → provider request to run a delegate_to_client tool.
message ToolExecutionInvoke {
  string execution_id = 1;
  reserved 2;
  reserved "agent_id";
  optional string session_id = 3;
  string tool_id = 4;
  string arguments_json = 5;
  optional string client_session_id = 7;
}

// ToolResultAttachment is a passive, out-of-band pointer a delegated tool
// attaches to its result: llmd stores kind+uri verbatim and never interprets
// either. The emitting system owns the uri scheme (e.g. "host://provenance/<id>",
// "owlbert://entity/<id>") and all data/semantics (confidence, counts, labels,
// …) live at whatever the uri resolves to, not on the wire here. Neither the
// model nor the user ever sees these; they ride beside the turn for an
// interested client to resolve later.
message ToolResultAttachment {
  // Discriminator an interested client filters on (e.g. "host_provenance",
  // "entity_reference"). Opaque to llmd; the emitter owns the vocabulary.
  string kind = 1;
  // Opaque pointer to the emitter-owned data this attachment references.
  string uri = 2;
}

// Legacy: provider → llmd reply to a ToolExecutionInvoke, keyed by execution_id.
message ToolExecutionResult {
  string execution_id = 1;
  string tool_id = 2;
  string content = 3;
  bool is_error = 4;
  // Optional opaque, tool-provided content-identity key for transport dedup
  // (e.g. read_code range coverage). Empty ⇒ this result is never deduped.
  optional string dedup_key = 5;
  // Optional passive attachments (see ToolResultAttachment). Empty ⇒ none.
  repeated ToolResultAttachment attachments = 6;
  // See SubmitToolResultsRequest.ends_turn. Ignored when is_error is true.
  bool ends_turn = 7;
}

// --- Executor stream protocol (preferred; see ToolProviderToServer) ---

// First frame from an executor: identifies it and declares the tools it serves.
//
// Registration is tenant-wide, keyed by (tenant from llmd-tenant-id metadata,
// executor_id); llmd-scope-id does not narrow it. Send the shared secret in
// metadata key "x-llmd-tool-provider-secret". llmd answers with
// ExecutorHelloAck. When the stream ends, the tools stay registered without an
// owner and pending calls fail as disconnected.
message ExecutorHello {
  string executor_id = 1;
  // Tools to register. Each must have a name and
  // execution = executor{executor_id: <this hello's executor_id>}; otherwise
  // it is listed in ExecutorHelloAck.rejected_tools with a reason.
  repeated ToolDefinition tools = 2;
  // Maximum concurrent calls the executor accepts; 0 ⇒ unlimited.
  uint32 max_concurrency = 3;
  string version = 4;
  // Per-process instance identity; a hello with a new instance_id for the
  // same (tenant, executor_id) supersedes the previous stream (its pending
  // calls fail as disconnected and it is closed with ABORTED). Keep it stable
  // across reconnects of one process; empty ⇒ llmd assigns a random one.
  string instance_id = 5;
}

message RejectedTool {
  string name = 1;
  string reason = 2;
}

// llmd's reply to ExecutorHello: always the first server frame on an executor stream.
message ExecutorHelloAck {
  string executor_id = 1;
  repeated string accepted_tools = 2;
  repeated RejectedTool rejected_tools = 3;
  // Maximum serialized ToolCallResult size llmd accepts per tool call; a larger
  // result is replaced by an error result for that call.
  uint64 max_result_bytes = 4;
}

enum ToolCallOrigin {
  TOOL_CALL_ORIGIN_UNSPECIFIED = 0;
  TOOL_CALL_ORIGIN_MODEL = 1;
  TOOL_CALL_ORIGIN_CLIENT = 2;
  TOOL_CALL_ORIGIN_SYSTEM = 3;
}

// A call dispatched to an executor. Named ExecutorToolCall because llm.v1.ToolCall
// is the model's tool-call message.
//
// Scope contract: executor registration is tenant-wide, so the stream says
// nothing about which scope a call belongs to. The call carries it instead:
// (tenant_id, scope_id) is the calling session's resolved scope. Reply with
// exactly one ToolCallResult for call_id; a ToolCallCancel for call_id means
// llmd stopped waiting.
message ExecutorToolCall {
  string call_id = 1;
  string tool_name = 2;
  string arguments_json = 3;
  string session_id = 4;
  string tenant_id = 5;
  ToolCallOrigin origin = 6;
  // Deadline llmd enforces for this call (tool's executor.max_duration_seconds,
  // default 600).
  uint32 max_duration_seconds = 7;
  // Scope of the calling session within tenant_id (llmd-scope-id). Empty when
  // the call has no resolved scope.
  string scope_id = 8;
  // Chat turn the call belongs to, when known (the id ToolCallCancel
  // reason "turn_cancelled" refers to). Empty for calls outside a turn.
  string turn_id = 9;
  // Key/value context supplied by the client (ChatStreamRequest.tool_context,
  // else EnsureSessionRequest.tool_context), passed unchanged to every tool
  // call in the turn. Empty when none was provided.
  map<string, string> tool_context = 10;
}

// llmd → executor: stop work on call_id; llmd no longer waits for its result.
message ToolCallCancel {
  string call_id = 1;
  // "turn_cancelled" (turn aborted), "deadline" (max_duration_seconds
  // elapsed), or "cancelled" (caller context ended).
  string reason = 2;
}

message ToolCallOutput {
  string content = 1;
  bool is_error = 2;
  optional string dedup_key = 3;
  repeated ToolResultAttachment attachments = 4;
  // See SubmitToolResultsRequest.ends_turn. Ignored when is_error is true.
  bool ends_turn = 5;
  // Display-only cards (an image, a chart; see llmd/visualcards) llmd puts
  // in the calling session right after this tool call, as session
  // attachments anchored to it. after_tool_call_id is set by llmd and any
  // value here is ignored. Unlike `attachments` (passive kind+uri pointers
  // nobody renders), these are shown to the user; the model never sees their
  // payload_json. Ignored when is_error is true; if they cannot be shown, the
  // call is reported to the model as failed.
  repeated MessageAttachment cards = 6;
}

message ToolCallFailure {
  string code = 1;
  string message = 2;
}

message ToolCallResult {
  string call_id = 1;
  oneof outcome {
    ToolCallOutput output = 2;
    ToolCallFailure failure = 3;
  }
}

// Host → llmd frames on ToolProviderService.Connect, and the reference for
// both protocols that stream carries. A tool host opens Connect to llmd (host =
// gRPC client). The first frame must be executor_hello (preferred) or hello
// (legacy); it selects the protocol for the whole stream, and any other first
// frame is refused with INVALID_ARGUMENT.
//
// 1. Executor protocol (PREFERRED; use it to declare and serve tools from
// another process or Go module). Go hosts should use the public
// github.com/johnewart/pyxis/toolexecutor client rather than speaking it by
// hand.
//
//	host → llmd  ExecutorHello{executor_id, tools[], max_concurrency, version, instance_id}  (first frame)
//	llmd → host  ExecutorHelloAck{accepted_tools, rejected_tools, max_result_bytes}
//	llmd → host  ExecutorToolCall{call_id, tool_name, arguments_json, session_id, tenant_id, origin, max_duration_seconds}
//	llmd → host  ToolCallCancel{call_id, reason}
//	host → llmd  ToolCallResult{call_id, output | failure}  (exactly one per call)
//
// Auth: the tenant comes from llmd-tenant-id request metadata. The shared
// secret configured on llmd (llmdhost.Config.ToolProviderSecret; the
// standalone binary reads LLMD_TOOL_PROVIDER_SHARED_SECRET) is sent in metadata
// key "x-llmd-tool-provider-secret". If llmd has no secret configured, every
// registration is refused (FAILED_PRECONDITION).
//
// Declaring tools: list them in ExecutorHello.tools, each with
// execution = executor{executor_id} equal to the hello's executor_id. llmd
// rejects (with a reason in ExecutorHelloAck.rejected_tools) a tool that has no
// name, is declared twice in the hello, collides with an inline builtin served
// by the llmd host, is already owned by a different executor in the tenant, has
// no executor binding, or whose binding's executor_id differs from the hello.
// An empty tenant or executor_id rejects every tool.
//
// Scope contract: registration is keyed by (tenant, executor_id) and is
// TENANT-WIDE: one stream serves every scope/workspace in the tenant. Each
// ExecutorToolCall carries the calling session's tenant_id, scope_id and
// session_id, so the host binds per-scope state from the call, not the stream.
// scope_id is empty when the call has no resolved scope (and from llmd builds
// that predate the field).
//
// Lifecycle:
//   - Stream ends: pending calls fail as "disconnected, outcome unknown"; the
//     tools stay registered without an owner (still advertised to sessions),
//     and calls to them fail fast with "executor not attached" until an
//     executor with that id says hello again.
//   - A hello with a new instance_id for the same (tenant, executor_id)
//     supersedes the old stream: its pending calls fail as disconnected and it
//     is closed with ABORTED. An empty instance_id is replaced by a random one,
//     so every reconnect then supersedes.
//   - Turn abort: llmd sends ToolCallCancel{reason: "turn_cancelled"} for each
//     in-flight call of the turn and refuses new calls for that turn.
//   - Deadline: each call is bounded by the tool's
//     executor.max_duration_seconds (default 600s), echoed in
//     ExecutorToolCall.max_duration_seconds. On expiry llmd sends
//     ToolCallCancel{reason: "deadline"} ("cancelled" when the caller's context
//     ends first) and stops waiting.
//   - Result size: a ToolCallResult whose serialized size exceeds
//     max_result_bytes (1 MiB) becomes an error result for that call; the
//     stream stays open.
//
// 2. Legacy provider protocol (ToolProviderHello / ToolExecutionInvoke /
// ToolExecutionResult). Registers a stream for the exact (tenant, scope) from
// llmd-tenant-id / llmd-scope-id metadata and declares no tools. llmd still
// uses it as the transport for delegate_to_client tools: the chat loop and the
// MCP server send ToolExecutionInvoke on it when a stream is connected for the
// scope, and the provider replies with ToolExecutionResult keyed by
// execution_id. The secret goes in ToolProviderHello.shared_secret. New
// integrations should use the executor protocol.
message ToolProviderToServer {
  oneof frame {
    ToolProviderHello hello = 1;
    ToolExecutionResult result = 2;
    ExecutorHello executor_hello = 3;
    ToolCallResult tool_call_result = 4;
  }
}

// llmd → host frames: invoke (legacy) or executor_hello_ack / tool_call /
// tool_call_cancel (executor protocol).
message ToolServerToProvider {
  oneof frame {
    ToolExecutionInvoke invoke = 1;
    ExecutorHelloAck executor_hello_ack = 2;
    ExecutorToolCall tool_call = 3;
    ToolCallCancel tool_call_cancel = 4;
  }
}

service ToolProviderService {
  // Bidirectional tool execution stream carrying one of two protocols,
  // selected by the first host frame (anything else ⇒ INVALID_ARGUMENT):
  //
  //   executor_hello (PREFERRED): declare tools tenant-wide and serve them.
  //     llmd replies ExecutorHelloAck, then sends ExecutorToolCall /
  //     ToolCallCancel; host replies ToolCallResult. Secret in metadata
  //     "x-llmd-tool-provider-secret". Go client: package toolexecutor.
  //   hello (LEGACY ToolProviderHello): per-(tenant, scope) transport for
  //     delegate_to_client tools; llmd sends ToolExecutionInvoke, host replies
  //     ToolExecutionResult. Secret in ToolProviderHello.shared_secret.
  //
  // Both require llmd-tenant-id metadata and a shared secret configured on
  // llmd (llmdhost.Config.ToolProviderSecret). See ToolProviderToServer for the full scope contract and
  // lifecycle.
  rpc Connect(stream ToolProviderToServer) returns (stream ToolServerToProvider);
}

// Direct unary invocation of an already-registered builtin tool (the same
// registry the agent loop draws from). This is a read/execute path through
// the existing toolregistry/toolexec composition: it never enqueues a
// graph/index build and never registers a new tool. Unknown tool_ids are
// refused generically (no enumeration of valid/gated ids in the error).
message InvokeToolRequest {
  string tool_id = 1;
  string arguments_json = 2;
  // Tenant and scope come from request metadata (llmd-tenant-id / llmd-scope-id).
  optional string session_id = 4;
}

message InvokeToolResponse {
  string result_json = 1;
  bool is_error = 2;
  optional string error_message = 3;
}

service LlmService {
  // Stateless one-shot completion (no agent / no session); caller supplies the provider+model.
  rpc GenerateOnce(GenerateOnceRequest) returns (AssistantReply);
  // Stateless completion over an explicit message list (no agent / no session).
  rpc Complete(CompleteRequest) returns (CompleteResponse);
  // Streaming variant of Complete: text deltas followed by a final frame with the full reply.
  rpc CompleteStream(CompleteRequest) returns (stream CompleteStreamResponse);
  rpc ChatStream(ChatStreamRequest) returns (stream ConversationStreamFrame);
  // Explicit Stop for the session's running turn. Client disconnect never cancels a turn.
  rpc CancelTurn(CancelTurnRequest) returns (CancelTurnResponse);
  // Unary invocation of a single already-registered builtin tool, outside any
  // ChatStream/agent loop. Read/execute only through the existing registry;
  // never schedules a graph/index build and never registers new tools.
  rpc InvokeTool(InvokeToolRequest) returns (InvokeToolResponse);
  rpc SubscribeSessionEvents(SubscribeSessionEventsRequest) returns (stream ConversationStreamFrame);
  rpc SubmitToolResults(SubmitToolResultsRequest) returns (SubmitToolResultsResponse);

  rpc GetSessionHistory(GetSessionHistoryRequest) returns (GetSessionHistoryResponse);
  rpc ReplaceSessionHistory(ReplaceSessionHistoryRequest) returns (ReplaceSessionHistoryResponse);

  // Session UI-artifact attachments (ask cards, embedded build runs). the client never opens llmd's
  // SQLite directly; these RPCs are the only write/read path for the attachment rows. Tenant/scope = llmd-tenant-id / llmd-scope-id metadata.
  rpc UpsertSessionAttachment(UpsertSessionAttachmentRequest) returns (UpsertSessionAttachmentResponse);
  rpc DeleteSessionAttachment(DeleteSessionAttachmentRequest) returns (DeleteSessionAttachmentResponse);
  rpc PatchAssistantMessageContent(PatchAssistantMessageContentRequest) returns (PatchAssistantMessageContentResponse);
  rpc AnswerAskCard(AnswerAskCardRequest) returns (AnswerAskCardResponse);
  // Every agent ask card still waiting on the user, across sessions.
  rpc ListOpenAskCards(ListOpenAskCardsRequest) returns (ListOpenAskCardsResponse);
  // Ask cards opening and closing, across sessions, as they happen.
  rpc SubscribeAskCards(SubscribeAskCardsRequest) returns (stream AskCardChange);

  // Session-scoped chat runtime for client chat; utility one-shots use GenerateOnce.
  rpc EnsureSession(EnsureSessionRequest) returns (EnsureSessionResponse);
  rpc UpdateSessionLlm(UpdateSessionLlmRequest) returns (UpdateSessionLlmResponse);
  rpc DestroySession(DestroySessionRequest) returns (DestroySessionResponse);
  rpc RegisterSessionTool(RegisterSessionToolRequest) returns (RegisterSessionToolResponse);
  rpc UnregisterSessionTool(UnregisterSessionToolRequest) returns (UnregisterSessionToolResponse);
  rpc ListSessionTools(ListSessionToolsRequest) returns (ListSessionToolsResponse);
  // Session-independent: registered tools + this tenant's executor tools.
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);

  // Agent profiles: reusable config bundles (prompt sections, provider/model
  // defaults, memory flag, tool mapping) resolved at session creation. Sessions
  // never reference a profile after creation. Static (code-defined) profiles
  // are read-only — Create/Update/Delete refuse them.
  rpc CreateAgentProfile(CreateAgentProfileRequest) returns (CreateAgentProfileResponse);
  rpc UpdateAgentProfile(UpdateAgentProfileRequest) returns (UpdateAgentProfileResponse);
  rpc DeleteAgentProfile(DeleteAgentProfileRequest) returns (DeleteAgentProfileResponse);
  rpc GetAgentProfile(GetAgentProfileRequest) returns (GetAgentProfileResponse);
  rpc ListAgentProfiles(ListAgentProfilesRequest) returns (ListAgentProfilesResponse);
  // Per-workspace overlays on static profiles. Get and List already return
  // the merged profile; these read and change the overlay itself.
  rpc GetAgentProfileOverlay(GetAgentProfileOverlayRequest) returns (GetAgentProfileOverlayResponse);
  rpc SetAgentProfileOverlay(SetAgentProfileOverlayRequest) returns (SetAgentProfileOverlayResponse);
  rpc ResetAgentProfileOverlay(ResetAgentProfileOverlayRequest) returns (ResetAgentProfileOverlayResponse);
  // Creates a session from a profile; composes EnsureSession from the profile's
  // fields plus the request's overrides.
  rpc CreateSessionFromAgentProfile(CreateSessionFromAgentProfileRequest) returns (CreateSessionFromAgentProfileResponse);

  rpc ListLlmProviders(ListLlmProvidersRequest) returns (ListLlmProvidersResponse);
  // Static catalog of provider kinds llmd can register (short-code, display name, credential
  // requirements). Drives "add provider" UI; unrelated to ListLlmProviders, which lists already-
  // configured provider instances.
  rpc ListSupportedLlmProviderTypes(ListSupportedLlmProviderTypesRequest) returns (ListSupportedLlmProviderTypesResponse);
  rpc RefreshLlmProviderModels(RefreshLlmProviderModelsRequest) returns (RefreshLlmProviderModelsResponse);
  rpc ListLlmCatalogModels(ListLlmCatalogModelsRequest) returns (ListLlmCatalogModelsResponse);
  rpc RegisterLlmProvider(RegisterLlmProviderRequest) returns (RegisterLlmProviderResponse);
  rpc UnregisterLlmProvider(UnregisterLlmProviderRequest) returns (UnregisterLlmProviderResponse);
  // Read back the full stored config of an already-registered provider (view/edit UI).
  rpc GetLlmProviderConfig(GetLlmProviderConfigRequest) returns (GetLlmProviderConfigResponse);
  // Replace the full stored config of an already-registered provider; NotFound if it doesn't exist.
  rpc UpdateLlmProviderConfig(UpdateLlmProviderConfigRequest) returns (UpdateLlmProviderConfigResponse);
  // Interactive CLI provider auth (e.g. `claude login`) piped through a server-side PTY. See
  // ProviderAuthCommandStart's doc comment for scope.
  rpc RunProviderAuthCommand(stream ProviderAuthCommandInput) returns (stream ProviderAuthCommandOutput);
  // Scan this machine for a CLI provider's binary. See
  // DiscoverProviderBinariesRequest's doc comment for why this is server-side.
  rpc DiscoverProviderBinaries(DiscoverProviderBinariesRequest) returns (DiscoverProviderBinariesResponse);
  // Check a CLI provider config (exists / new enough / signed in / can resume)
  // without registering it. Unary, so it works over gRPC-Web too -- unlike
  // RunProviderAuthCommand, which is bidi. See CheckProviderConnectionRequest.
  rpc CheckProviderConnection(CheckProviderConnectionRequest) returns (CheckProviderConnectionResponse);
  // Browser-compatible interactive provider auth: the RunProviderAuthCommand
  // PTY split into unary + server-streaming calls, because gRPC-Web cannot do
  // bidi. See StartProviderAuthSessionRequest's comment for when to use which.
  rpc StartProviderAuthSession(StartProviderAuthSessionRequest) returns (StartProviderAuthSessionResponse);
  rpc StreamProviderAuthOutput(StreamProviderAuthOutputRequest) returns (stream ProviderAuthCommandOutput);
  rpc SendProviderAuthInput(SendProviderAuthInputRequest) returns (SendProviderAuthInputResponse);
  rpc EndProviderAuthSession(EndProviderAuthSessionRequest) returns (EndProviderAuthSessionResponse);
  rpc RegisterUserEmbeddingProvider(RegisterUserEmbeddingProviderRequest) returns (RegisterUserEmbeddingProviderResponse);
  rpc UnregisterUserEmbeddingProvider(UnregisterUserEmbeddingProviderRequest) returns (UnregisterUserEmbeddingProviderResponse);
  rpc ListEmbeddingProviders(ListEmbeddingProvidersRequest) returns (ListEmbeddingProvidersResponse);

  // Token accounting and tool result expansion.
  rpc GetSessionTokenUsage(GetSessionTokenUsageRequest) returns (GetSessionTokenUsageResponse);
  rpc ListTurnDecorations(ListTurnDecorationsRequest) returns (ListTurnDecorationsResponse);
  rpc GetSessionTurnBreakdown(GetSessionTurnBreakdownRequest) returns (GetSessionTurnBreakdownResponse);
  // Scope-wide (or all scopes in the tenant) token + compression-savings rollups for the status bar / overview.
  rpc GetScopeTokenMetrics(GetScopeTokenMetricsRequest) returns (GetScopeTokenMetricsResponse);
  rpc GetTokenSavingsTimeline(GetTokenSavingsTimelineRequest) returns (GetTokenSavingsTimelineResponse);
  rpc GetTokenUsageTimeline(GetTokenUsageTimelineRequest) returns (GetTokenUsageTimelineResponse);
  // Aggregated token usage (incl. reasoning tokens) filtered by time range and serving provider.
  rpc QueryUsage(QueryUsageRequest) returns (QueryUsageResponse);
  // Per-tool call/error counts and min/median/mean/max duration over a time window.
  rpc QueryToolUsage(QueryToolUsageRequest) returns (QueryToolUsageResponse);
  rpc GetToolResultOriginal(GetToolResultOriginalRequest) returns (GetToolResultOriginalResponse);
  rpc UpdateSessionCompressionSettings(UpdateSessionCompressionSettingsRequest) returns (UpdateSessionCompressionSettingsResponse);

  // Session metadata (Tier 2: session-scoped state).
  // Per-session composer draft (single value; survives UI reload/crash).
  rpc UpsertSessionDraft(UpsertSessionDraftRequest) returns (UpsertSessionDraftResponse);
  rpc GetSessionDraft(GetSessionDraftRequest) returns (GetSessionDraftResponse);
  rpc ClearSessionDraft(ClearSessionDraftRequest) returns (ClearSessionDraftResponse);

  // Per-session message queue. Editing surface (enqueue/list/remove/reorder/
  // pause) plus the drainer protocol (claim/heartbeat/mark-started/retire/
  // release). llmd never drains the queue itself; see the message comments above.
  rpc EnqueueMessage(EnqueueMessageRequest) returns (EnqueueMessageResponse);
  rpc ListQueue(ListQueueRequest) returns (ListQueueResponse);
  rpc RemoveQueuedMessage(RemoveQueuedMessageRequest) returns (RemoveQueuedMessageResponse);
  rpc ReorderQueue(ReorderQueueRequest) returns (ReorderQueueResponse);
  rpc SetQueuePaused(SetQueuePausedRequest) returns (SetQueuePausedResponse);
  rpc ClaimNextQueuedMessage(ClaimNextQueuedMessageRequest) returns (ClaimNextQueuedMessageResponse);
  rpc HeartbeatQueuedMessage(HeartbeatQueuedMessageRequest) returns (HeartbeatQueuedMessageResponse);
  rpc MarkQueuedMessageStarted(MarkQueuedMessageStartedRequest) returns (MarkQueuedMessageStartedResponse);
  rpc RetireQueuedMessage(RetireQueuedMessageRequest) returns (RetireQueuedMessageResponse);
  rpc ReleaseQueuedMessage(ReleaseQueuedMessageRequest) returns (ReleaseQueuedMessageResponse);

  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc SetSessionMeta(SetSessionMetaRequest) returns (SetSessionMetaResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc UpdateSessionTags(UpdateSessionTagsRequest) returns (UpdateSessionTagsResponse);
  rpc SetSessionCursor(SetSessionCursorRequest) returns (SetSessionCursorResponse);
  rpc AdvanceSessionCursor(AdvanceSessionCursorRequest) returns (AdvanceSessionCursorResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  // Storage use of the database, per table and per session.
  rpc GetStorageStats(GetStorageStatsRequest) returns (GetStorageStatsResponse);
  // Delete several sessions through the same purge as DeleteSession.
  rpc DeleteSessions(DeleteSessionsRequest) returns (DeleteSessionsResponse);
  // Trim leftover events, then VACUUM. One run at a time; callers share it.
  rpc Compact(CompactRequest) returns (CompactResponse);
  // Clone a session (optionally up to a message) into a new independent session.
  rpc ForkSession(ForkSessionRequest) returns (ForkSessionResponse);
}

// ---------------------------------------------------------------------------
// Session-scoped opaque key/value cache
// ---------------------------------------------------------------------------
// A generic, ephemeral-by-intent K/V store scoped to (tenant, scope, session, namespace).
// Tools (e.g. read_code range-coverage tracking) use it to remember derivable
// state across calls within a session — anything stored here must be safe to lose.
// Values are opaque bytes; llmd never interprets them. Lives in llmd because llmd
// is a long-lived singleton, so in-process callers and CLI/MCP tool calls share it.

message SessionCacheGetRequest {
  string session_id = 1;
  string namespace = 2;
  string key = 3;
}
message SessionCacheGetResponse {
  bytes value = 1;
  bool found = 2;
}
message SessionCacheSetRequest {
  string session_id = 1;
  string namespace = 2;
  string key = 3;
  bytes value = 4;
}
message SessionCacheSetResponse {
  bool success = 1;
}
message SessionCacheDeleteRequest {
  string session_id = 1;
  string namespace = 2;
  // key empty => delete the entire namespace for the session.
  string key = 3;
}
message SessionCacheDeleteResponse {
  int64 deleted = 1;
}

// Classification of a failed provider call.
enum LlmErrorKind {
  LLM_ERROR_KIND_UNSPECIFIED = 0;
  LLM_ERROR_KIND_RATE_LIMITED = 1;
  LLM_ERROR_KIND_AUTH = 2;
  LLM_ERROR_KIND_PERMISSION_DENIED = 3;
  LLM_ERROR_KIND_CONTEXT_LENGTH = 4;
  LLM_ERROR_KIND_CONTENT_FILTER = 5;
  LLM_ERROR_KIND_UNAVAILABLE = 6;
  LLM_ERROR_KIND_TIMEOUT = 7;
  LLM_ERROR_KIND_INVALID_REQUEST = 8;
  LLM_ERROR_KIND_UNKNOWN = 9;
}

// Structured error from an LLM provider call.
message LlmError {
  LlmErrorKind kind = 1;
  LlmProviderType provider_type = 2;
  // HTTP (or provider) status code; 0 when not applicable.
  int32 provider_status = 3;
  bool retryable = 4;
  // Suggested wait before retry; unset when unknown.
  google.protobuf.Duration retry_after = 5;
}

service SessionCacheService {
  rpc Get(SessionCacheGetRequest) returns (SessionCacheGetResponse);
  rpc Set(SessionCacheSetRequest) returns (SessionCacheSetResponse);
  rpc Delete(SessionCacheDeleteRequest) returns (SessionCacheDeleteResponse);
}
